<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Vectronix – webbasierter Schaltplan-Editor nach DIN EN 60617 mit SVG- und LaTeX-TikZ-Export. Läuft komplett lokal im Browser.">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M4 16h6l3-8 6 16 3-8h6' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vectronix">
<title>Vectronix – Schaltplandesigner (DIN EN 60617)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#eef0f2;--panel:#fff;--border:#c8ccd0;--text:#1e1e2e;--accent:#2563eb;--accent-hover:#1d4ed8;--accent-light:#3b82f620;--sel:#3b82f640;--danger:#dc2626;--tb:40px}
@media (pointer:coarse){:root{--tb:46px}}
html,body{overscroll-behavior:none}
body{font-family:Inter,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation}
#toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#toolbar .sep{width:1px;align-self:stretch;background:var(--border);margin:2px;flex-shrink:0}
#toolbar .spacer{flex:1;min-width:4px}
#toolbar .seg{display:flex;background:#f1f3f5;border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.tb{height:var(--tb);min-width:var(--tb);padding:0 12px;border:1px solid transparent;border-radius:8px;background:none;color:var(--text);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .12s}
.tb.icon{padding:0}
@media (hover:hover){.tb:hover{background:#e5e7eb}}
.tb:active{background:#dde1e6}
.tb.active,.tb.primary{background:var(--accent);color:#fff}
.tb.primary:active{background:var(--accent-hover)}
.tb.danger{color:var(--danger)}
.tb.toggle.on{background:#dbe6fd;color:var(--accent)}
.tb svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tb svg.chev{width:14px;height:14px;margin-left:-2px}
.tb:disabled{opacity:.35;cursor:default;background:none}
@media (max-width:1100px){.l1{display:none}}
@media (max-width:860px){.l2{display:none}#toolbar{gap:4px;padding:6px}}
@media (max-width:800px){.l4{display:none}}
@media (max-width:640px){.l3{display:none}}
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#main.no-sidebar #sidebar{display:none}
#sidebar{width:212px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:4px 8px 12px;overscroll-behavior:contain}
#sidebar h3{font-size:11px;font-weight:600;text-transform:uppercase;color:#888;margin:12px 2px 6px;letter-spacing:.5px}
#sidebar .parts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#sidebar .part-btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 3px 5px;cursor:grab;text-align:center;font-size:11px;line-height:1.2;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;hyphens:manual;touch-action:pan-y;transition:background .12s,border-color .12s}
@media (hover:hover){#sidebar .part-btn:hover{background:#f0f4ff;border-color:var(--accent)}}
#sidebar .part-btn.active{background:#e8efff;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
#sidebar .part-btn svg{display:block;width:48px;height:30px;flex-shrink:0}
#canvas-wrap{flex:1;overflow:hidden;position:relative;background:#fff;min-width:0}
#canvas{display:block;width:100%;height:100%;touch-action:none}
.floatbar{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 24px #0000001f;z-index:10;max-width:calc(100% - 16px)}
.floatbar[hidden]{display:none}
#selbar{bottom:16px}
#selbar .selname{font-size:13px;font-weight:600;color:#555;padding:0 8px 0 10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hintbar{top:12px;padding-left:14px}
#hint-text{font-size:14px;min-width:0;padding-right:6px}
#statusbar{display:flex;align-items:center;justify-content:space-between;padding:3px 12px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:#666;flex-shrink:0;gap:12px}
#statusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (pointer:coarse){.fine-only{display:none}}
.context-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px #00000026;padding:6px;z-index:1000;min-width:230px}
.context-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;font-size:14px;cursor:pointer;border-radius:8px;color:var(--text)}
.context-menu button:hover,.context-menu button:active{background:#eef0f3}
.context-menu button svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.context-menu .key{margin-left:auto;padding-left:16px;font-size:12px;color:#999}
.context-menu hr{margin:4px 6px;border:none;border-top:1px solid var(--border)}
@media (pointer:coarse){.context-menu button{padding:13px 14px;font-size:15px}.context-menu .key{display:none}}
.modal-overlay{position:fixed;inset:0;background:#00000040;z-index:2000;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:#fff;border-radius:14px;padding:24px;box-shadow:0 8px 32px #00000025;min-width:min(340px,100%);max-width:min(640px,100%);max-height:90vh;max-height:90dvh;overflow-y:auto;user-select:text;-webkit-user-select:text}
.modal h2{font-size:18px;margin-bottom:12px;color:var(--text)}
.modal label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;margin-top:12px;color:#555}
.modal input[type=text],.modal input[type=number],.modal textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit}
.modal input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.modal textarea{min-height:56px;resize:vertical;font-family:monospace}
.modal .hint{margin-top:10px;font-size:12px;color:#777;background:#f5f5f5;padding:8px 10px;border-radius:6px}
.modal .btns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:16px}
.modal .btns button{min-height:44px;padding:0 20px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:15px;background:#fff;color:var(--text)}
.modal .btns button:hover{background:#f3f4f6}
.modal .btns .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal .btns .primary:hover{background:var(--accent-hover)}
.modal table{border-collapse:collapse;font-size:14px}
.modal td{padding:5px 14px 5px 0;vertical-align:top}
.segctl{display:flex;flex-wrap:wrap;gap:4px;background:#f1f3f5;border-radius:10px;padding:3px}
.seg-opt{margin:0!important;flex:1 1 auto}
.seg-opt input{position:absolute;opacity:0;pointer-events:none}
.seg-opt span{display:block;text-align:center;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap}
.seg-opt input:checked+span{background:#fff;box-shadow:0 1px 3px #0002;font-weight:600}
.seg-opt input:focus-visible+span{outline:2px solid var(--accent)}
.modal label.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--text)}
.blank-mark{fill:#fff7ed99;stroke:#d97706;stroke-width:1.2;stroke-dasharray:4 3;pointer-events:none}
.comp-blank .comp-body>:not(.comp-hit):not(.pin-handle):not(.blank-mark){opacity:.45}
.wire-blank .wire{stroke:#d97706;stroke-dasharray:6 4}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;font-size:13px;color:#555}
.tpl:hover,.tpl:active{border-color:var(--accent);background:#f5f8ff}
.tpl svg{width:100%;height:90px;margin-bottom:4px}
.tpl b{font-size:14px;color:var(--text)}
.qr-box{width:min(300px,70vw);margin:0 auto 6px;cursor:zoom-in}
.qr-box svg{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:8px}
.qr-full{position:fixed;inset:0;z-index:4000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:zoom-out}
.qr-full svg{width:min(88vh,92vw);height:min(88vh,92vw)}
.qr-full p{font-size:16px;color:#555}
.intro-step{display:flex;gap:14px;align-items:flex-start;margin:14px 0}
.intro-step>span{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.intro-step b{font-size:15px}
.intro-step p{font-size:14px;color:#555;margin-top:2px;line-height:1.4}
.modal kbd{background:#f3f4f6;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;font-family:inherit}
#selection-rect{fill:var(--sel);stroke:#16a34a;stroke-width:1.5;stroke-dasharray:4,3;display:none;pointer-events:none}
.junction-dot{cursor:pointer}
.junction-dot:hover{fill:#f59e0b}
.wire-hit{stroke:transparent}
@media (pointer:coarse){.wire-hit{stroke-width:26px}}
.wire-g.wire-sel .wire{stroke:var(--accent);stroke-width:1.6}
.wire-handle{fill:#fff;stroke:var(--accent);stroke-width:1.2;pointer-events:none}
.label-sel text{fill:var(--accent)}
.pin-handle{cursor:crosshair}
.comp-selected .pin-handle{fill:#2563eb30}
.comp-selected .comp-body *:not(text):not(.pin-handle):not(.comp-hit){stroke:var(--accent)}
.comp-selected .comp-body [fill="#000"]{fill:var(--accent)}
.comp-selected .comp-body text{fill:var(--accent);stroke:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1e1e2eee;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3000;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:760px){
  #main{flex-direction:column}
  #sidebar{width:100%;height:98px;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px;gap:6px}
  #sidebar h3{display:none}
  #sidebar .parts{display:flex;gap:6px}
  #sidebar .part-btn{width:84px;min-height:0;flex-shrink:0;touch-action:pan-x}
  #toolbar{padding:4px 6px;gap:4px}
  #statusbar .sb-brand{display:none}
}
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-parts" class="tb toggle on" onclick="toggleSidebar()" title="Bauteil-Palette ein-/ausblenden"><i data-i="parts"></i><span class="l1">Bauteile</span></button>
  <div class="sep"></div>
  <div class="seg" id="tool-group">
    <button id="tool-select" class="tb active" onclick="setTool('select')" title="Auswählen / Verschieben (V)"><i data-i="select"></i><span class="l4">Auswahl</span></button>
    <button id="tool-wire" class="tb" onclick="setTool('wire')" title="Leitung zeichnen (W)"><i data-i="wire"></i><span class="l4">Leitung</span></button>
    <button id="tool-text" class="tb" onclick="setTool('text')" title="Text einfügen (T)"><i data-i="text"></i><span class="l4">Text</span></button>
    <button id="tool-lasso" class="tb" onclick="setTool('lasso')" title="Mehrere Objekte mit einem Rahmen auswählen (M, oder Umschalt + Ziehen)"><i data-i="lasso"></i><span class="l3 l1">Rahmen</span></button>
  </div>
  <button id="btn-sim" class="tb" onclick="toggleSim()" title="Simulation starten/beenden (Leertaste)"><i data-i="play"></i><span class="l2">Simulieren</span></button>
  <div class="sep"></div>
  <button id="btn-undo" class="tb icon" onclick="undo()" title="Rückgängig (Strg+Z)"><i data-i="undo"></i></button>
  <button id="btn-redo" class="tb icon" onclick="redo()" title="Wiederholen (Strg+Y)"><i data-i="redo"></i></button>
  <div class="spacer"></div>
  <button class="tb icon fine-only" onclick="zoomOut()" title="Verkleinern (−)"><i data-i="zoomout"></i></button>
  <button class="tb icon" onclick="zoomFit()" title="Alles anzeigen (F)"><i data-i="fit"></i></button>
  <button class="tb icon fine-only" onclick="zoomIn()" title="Vergrößern (+)"><i data-i="zoomin"></i></button>
  <div class="sep"></div>
  <button class="tb" onclick="openMenu('export', this)" title="Exportieren"><i data-i="export"></i><span class="l1">Export</span><i data-i="chev"></i></button>
  <button class="tb" onclick="openMenu('file', this)" title="Datei und Ansicht"><i data-i="file"></i><span class="l1">Datei</span><i data-i="chev"></i></button>
  <button class="tb icon l2" onclick="showHelp()" title="Hilfe (?)"><i data-i="help"></i></button>
  <input type="file" id="load-input" accept=".vectronix,.json" style="display:none" onchange="loadJSON(event)">
</div>

<div id="main">
  <div id="sidebar"></div>
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Karo: Punkte = Einrastpunkte (8), Linien alle 5 Schritte (40) und alle 25 Schritte (200).
             Die Muster sind um einen halben Abstand versetzt, damit Punkte und Linien nicht am Kachelrand abgeschnitten werden. -->
        <pattern id="grid-dot" x="-4" y="-4" width="8" height="8" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r=".9" fill="#a9b3c1"/>
        </pattern>
        <pattern id="grid-minor" x="-20" y="-20" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M20 0V40M0 20H40" fill="none" stroke="#dde3ea" stroke-width="1"/>
        </pattern>
        <pattern id="grid-major" x="-100" y="-100" width="200" height="200" patternUnits="userSpaceOnUse">
          <path d="M100 0V200M0 100H200" fill="none" stroke="#b3bfcd" stroke-width="1"/>
        </pattern>
      </defs>
      <g id="grid-layer" pointer-events="none">
        <rect id="grid-bg-minor" fill="url(#grid-minor)"/>
        <rect id="grid-bg-major" fill="url(#grid-major)"/>
        <rect id="grid-bg-dot" fill="url(#grid-dot)"/>
      </g>
      <g id="wires-layer"></g>
      <g id="junctions-layer"></g>
      <g id="sim-under" pointer-events="none"></g>
      <g id="components-layer"></g>
      <g id="labels-layer"></g>
      <g id="sim-over" pointer-events="none"></g>
      <rect id="selection-rect"/>
      <g id="temp-layer"></g>
    </svg>
    <div id="hintbar" class="floatbar" hidden></div>
    <div id="selbar" class="floatbar" hidden></div>
  </div>
</div>

<div id="statusbar">
  <span><span class="fine-only"><span id="cursor-pos">X: 0  Y: 0</span> | </span><span id="zoom-level">100%</span> | <span id="mode-info">Auswählen</span></span>
  <span><span class="sb-brand">Vectronix · DIN EN 60617 · </span><a href="https://schmidbauer.io/impressum/" target="_blank" rel="noopener" style="color:inherit">Impressum</a> · <a href="https://schmidbauer.io/datenschutz/" target="_blank" rel="noopener" style="color:inherit">Datenschutz</a></span>
</div>

<div id="context-menu" class="context-menu" style="display:none"></div>
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>
<div id="toast" class="toast"></div>
<noscript>Vectronix benötigt JavaScript.</noscript>

<script>

const SVG_NS = 'http://www.w3.org/2000/svg';

const state = {
  tool: 'select',
  components: [],
  wires: [],
  labels: [],
  junctions: [],
  sel: null,            // {type:'c'|'w'|'l', id}
  multi: [],            // Mehrfachauswahl: Liste von {type, id}
  sim: false,           // Simulation aktiv
  simPressed: new Set(),// gedrückte Taster (nur Simulation)
  simBlown: new Set(),  // ausgelöste Sicherungen (nur Simulation)
  clip: null,           // Zwischenablage (Fallback, falls localStorage fehlt)
  counter: { R:0, C:0, L:0, D:0, Q:0, T:0, S:0, K:0, M:0, G:0, V:0, F:0, N:0, IC:0, X:0, P:0, U:0, Y:0, B:0, H:0, A:0, E:0 },
  grid: true,
  diagonal: false,     // Leitungen schräg statt rechtwinklig (Schalter in der Hinweisleiste)
  wireStart: null,
  selStart: null,
  selRect: null,        // {x,y,w,h} Export-Bereich
  placeType: null,
  view: { x: -40, y: -40, k: 1 },
  history: [],
  historyIdx: -1,
  maxHistory: 60,
};

// ============================================================
// BAUTEIL-DEFINITIONEN (DIN EN 60617)
// ============================================================
// Koordinaten relativ zum Bauteil-Mittelpunkt (0,0); pins = Anschlusspunkte

// Pfeil (Linie + gefüllte Spitze) für Symbole, z. B. Licht bei LED, LDR, Solarzelle
function arrowSVG(x1, y1, x2, y2, head = 5, half = 2.5) {
  const d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d;
  const bx = x2 - ux * head, by = y2 - uy * head, px = -uy * half, py = ux * half;
  const f = v => +v.toFixed(2);
  return `<line x1="${x1}" y1="${y1}" x2="${f(bx)}" y2="${f(by)}" stroke="#000" stroke-width=".9"/>`
    + `<polygon points="${x2},${y2} ${f(bx + px)},${f(by + py)} ${f(bx - px)},${f(by - py)}" fill="#000"/>`;
}

// Bipolartransistor: Kreis, Basisbalken, Kollektor oben, Emitter unten mit Pfeil
function bjtSVG(pnp) {
  // Emitterlinie von (-8,6) nach (16,18): npn-Pfeil zeigt nach außen, pnp-Pfeil zur Basis
  const ux = 24 / Math.hypot(24, 12), uy = 12 / Math.hypot(24, 12);
  const tip = pnp ? { x: -8 + 24 * 0.3, y: 6 + 12 * 0.3, dx: -ux, dy: -uy } : { x: 10, y: 15, dx: ux, dy: uy };
  const bx = tip.x - tip.dx * 7, by = tip.y - tip.dy * 7, px = -tip.dy * 3.2, py = tip.dx * 3.2;
  const f = v => +v.toFixed(2);
  return `<circle cx="2" cy="0" r="24" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="-32" y1="0" x2="-8" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="-8" y1="-14" x2="-8" y2="14" stroke="#000" stroke-width="2"/>
      <path d="M-8-6L16-18V-32M-8 6L16 18V32" fill="none" stroke="#000" stroke-width="1.0"/>
      <polygon points="${f(tip.x)},${f(tip.y)} ${f(bx + px)},${f(by + py)} ${f(bx - px)},${f(by - py)}" fill="#000"/>`;
}

const C = {
  resistor: {
    name: 'Widerstand', prefix: 'R',
    svg: `<rect x="-30" y="-10" width="60" height="20" rx="1" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="-40" y1="0" x2="-30" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="30" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-40,y:0},{x:40,y:0}], w:80, h:20
  },
  potentiometer: {
    name: 'Potentiometer', prefix: 'R',
    svg: `<rect x="-30" y="-10" width="60" height="20" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="-40" y1="0" x2="-30" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="30" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="24" x2="0" y2="17" stroke="#000" stroke-width="1.0"/>
      <polygon points="0,10 -4,18 4,18" fill="#000"/>`,
    pins: [{x:-40,y:0},{x:40,y:0},{x:0,y:24}], w:80, h:48
  },
  capacitor: {
    name: 'Kondensator', prefix: 'C',
    svg: `<line x1="0" y1="-24" x2="0" y2="-4" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="4" x2="0" y2="24" stroke="#000" stroke-width="1.0"/>
      <line x1="-16" y1="-4" x2="16" y2="-4" stroke="#000" stroke-width="2.5"/>
      <line x1="-16" y1="4" x2="16" y2="4" stroke="#000" stroke-width="2.5"/>`,

function genId() { return (Math.random()*36**8|0).toString(36) + Date.now().toString(36).slice(-4); }

function getNextId(prefix, sub) {
  if(!state.counter[prefix]) state.counter[prefix] = 0;
  let id;
  do { state.counter[prefix]++; id = prefix + (sub ? '_' : '') + state.counter[prefix]; }
  while(state.components.some(c => c.label === id));
  return id;
}

function el(tag, attr, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  if(attr) for(const [k, v] of Object.entries(attr)) e.setAttribute(k, v);
  if(parent) parent.appendChild(e);
  return e;
}

function escapeXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const SUB = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋'};
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};

function latexToUnicode(s) {
  const m = {
    '\\Omega':'Ω','\\Delta':'Δ','\\Phi':'Φ','\\Theta':'Θ','\\mu':'μ','\\alpha':'α','\\beta':'β','\\gamma':'γ',
    '\\delta':'δ','\\epsilon':'ε','\\theta':'θ','\\lambda':'λ','\\pi':'π',
    '\\sigma':'σ','\\omega':'ω','\\varphi':'φ','\\times':'×','\\cdot':'·','\\sim':'~','\\partial':'∂','\\infty':'∞',
    '\\neq':'≠','\\leq':'≤','\\geq':'≥','\\approx':'≈','\\pm':'±',
    '\\mathrm':'','\\text':'','\\;':' ','\\,':' ','\\!':''
  };
  s = String(s).replace(/\$\$([^$]+)\$\$/g, '$1').replace(/\$([^$]+)\$/g, '$1');
  for(const [k, v] of Object.entries(m)) s = s.split(k).join(v);
  s = s.replace(/_\{([^}]*)\}|_([0-9a-zA-Z+-])/g, (all, a, b) => {
    const t = a ?? b;
    return [...t].every(ch => SUB[ch]) ? [...t].map(ch => SUB[ch]).join('') : all;
  });
  s = s.replace(/\^\{([^}]*)\}|\^([0-9+-])/g, (all, a, b) => {
    const t = a ?? b;
    return [...t].every(ch => SUP[ch]) ? [...t].map(ch => SUP[ch]).join('') : all;
  });
  return s.replace(/[{}]/g, '');
}

function applyView() {
  const wrap = $('canvas-wrap');
  const w = wrap.clientWidth || 800, h = wrap.clientHeight || 600;
  const v = state.view;
  const vw = w / v.k, vh = h / v.k;
  canvas.setAttribute('viewBox', `${v.x} ${v.y} ${vw} ${vh}`);
  for(const id of ['grid-bg-minor', 'grid-bg-major', 'grid-bg-dot']) {
    const r = $(id);
    r.setAttribute('x', v.x); r.setAttribute('y', v.y);
    r.setAttribute('width', vw); r.setAttribute('height', vh);
  }
  updateGridDetail();
  $('zoom-level').textContent = Math.round(v.k * 100) + '%';
}

function zoomAt(clientX, clientY, factor) {
  const v = state.view;
  const rect = $('canvas-wrap').getBoundingClientRect();
  const sx = clientX - rect.left, sy = clientY - rect.top;
  const wx = v.x + sx / v.k, wy = v.y + sy / v.k;
  v.k = Math.min(4, Math.max(0.2, v.k * factor));
  v.x = wx - sx / v.k; v.y = wy - sy / v.k;
  applyView();
}

function zoomCenter(factor) {
  const r = $('canvas-wrap').getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
}
function zoomIn() { zoomCenter(1.25); }
function zoomOut() { zoomCenter(1 / 1.25); }
function zoomReset() {
  const r = $('canvas-wrap').getBoundingClientRect();
  const v = state.view;
  const cx = v.x + r.width / 2 / v.k, cy = v.y + r.height / 2 / v.k;
  v.k = 1; v.x = cx - r.width / 2; v.y = cy - r.height / 2;
  applyView();
}
function zoomFit() {
  if(!state.components.length && !state.wires.length && !state.labels.length) { resetView(); return; }
  const b = contentBounds();
  const r = $('canvas-wrap').getBoundingClientRect();
  const k = Math.min(2, Math.max(0.2, Math.min(r.width / b.w, r.height / b.h) * 0.95));
  state.view.k = k;
  state.view.x = b.x + b.w / 2 - r.width / 2 / k;
  state.view.y = b.y + b.h / 2 - r.height / 2 / k;
  applyView();
}
function resetView() { state.view = { x: -40, y: -40, k: 1 }; applyView(); }

// Ansicht mit einem Zeiger verschieben; ohne Bewegung zählt es als Tippen (onTap)
function startPan(e, onTap) {
  const sx = e.clientX, sy = e.clientY, prevCursor = canvas.style.cursor;
  let lx = sx, ly = sy, moved = false;
  track(ev => {
    if(!moved) {
      if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
      moved = true;
      canvas.style.cursor = 'grabbing';
    }
    state.view.x -= (ev.clientX - lx) / state.view.k;
    state.view.y -= (ev.clientY - ly) / state.view.k;
    lx = ev.clientX; ly = ev.clientY;
    applyView();
  }, (ev, cancelled) => {
    canvas.style.cursor = prevCursor;
    if(!moved && !cancelled && onTap) onTap(ev);
  }, e.pointerId);
}

// ============================================================
// POINTER-HILFE
// ============================================================

// Verfolgt einen Zeiger bis zum Loslassen. onUp(e, cancelled): cancelled = true bei
// pointercancel oder wenn eine Zwei-Finger-Geste die Aktion abbricht (e ist dann null).
let activeTrack = null;
function track(onMove, onUp, pointerId) {
  const mine = e => pointerId == null || e.pointerId === pointerId;
  const mv = e => { if(mine(e) && onMove) onMove(e); };
  const end = (e, cancelled) => {
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    if(activeTrack === t) activeTrack = null;
    onUp && onUp(e, cancelled);
  };
  const up = e => { if(mine(e)) end(e, e.type === 'pointercancel'); };
  const t = { cancel: () => end(null, true) };
  document.addEventListener('pointermove', mv);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  activeTrack = t;
  return t;
}

// Doppeltippen auf Touch-Geräten (dblclick ist dort unzuverlässig)
let lastTap = { key: null, t: 0 };
function doubleTap(e, key) {
  if(!isTouch(e)) return false;
  const now = Date.now();
  const hit = lastTap.key === key && now - lastTap.t < 400;
  lastTap = hit ? { key: null, t: 0 } : { key, t: now };
  return hit;
}

// ============================================================
// ZWEI-FINGER-GESTE (Verschieben + Zoomen)
// ============================================================

const touches = new Map();
let pinch = null, touchBlocked = false;

function pinchInfo() {
  const [a, b] = [...touches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}

// Läuft in der Capture-Phase vor allen anderen Handlern der Zeichenfläche
canvas.addEventListener('pointerdown', e => {
  lastPointerType = e.pointerType;
  if(e.pointerType !== 'touch') return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(touches.size >= 2) {
    e.stopImmediatePropagation();
    e.preventDefault();
    if(activeTrack) activeTrack.cancel();
    touchBlocked = true;
    pinch = { ...pinchInfo(), view: { ...state.view } };
  } else if(touchBlocked) e.stopImmediatePropagation();
}, true);

document.addEventListener('pointermove', e => {
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(!pinch || touches.size < 2) return;
  const p = pinchInfo(), v0 = pinch.view, v = state.view;
  const r = $('canvas-wrap').getBoundingClientRect();
  const wx = v0.x + (pinch.mx - r.left) / v0.k, wy = v0.y + (pinch.my - r.top) / v0.k;
  v.k = Math.min(4, Math.max(0.2, v0.k * p.d / pinch.d));
  v.x = wx - (p.mx - r.left) / v.k;
  v.y = wy - (p.my - r.top) / v.k;
  applyView();
});

function touchEnd(e) {
  if(!touches.delete(e.pointerId)) return;
  if(touches.size < 2) pinch = null;
  if(touches.size === 0) touchBlocked = false;
}
document.addEventListener('pointerup', touchEnd);
document.addEventListener('pointercancel', touchEnd);
// Safari: Seitenzoom per Geste unterbinden
document.addEventListener('gesturestart', e => e.preventDefault());

let lastPointerType = 'mouse';

function getRawPos(e) {
  const pt = canvas.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(canvas.getScreenCTM().inverse());
}

function getSnappedPos(e) {
  const p = getRawPos(e);
  return { x: snap(p.x), y: snap(p.y) };
}

// Rastet an Bauteil-Pins ein (Radius PIN_SNAP), sonst am Raster
function getWirePoint(e) {
  const raw = getRawPos(e);
  const r = (isTouch(e) ? PIN_SNAP * 2 : PIN_SNAP) / Math.max(state.view.k, 0.5);
  let best = null, bd = r;
  for(const c of state.components) {
    const def = C[c.type];
    for(let i = 0; i < def.pins.length; i++) {
      const p = pinWorld(c, i);
      const d = Math.hypot(p.x - raw.x, p.y - raw.y);
      if(d <= bd) { bd = d; best = p; }
    }
  }
  if(best) return { x: best.x, y: best.y, pin: true };
  return { x: snap(raw.x), y: snap(raw.y) };
}

// BAUTEIL-GEOMETRIE
// ============================================================

function rot(x, y, a) {
  a = (((a || 0) % 360) + 360) % 360;
  switch(a) {
    case 90: return { x: -y, y: x };
    case 180: return { x: -x, y: -y };
    case 270: return { x: y, y: -x };
    default: return { x, y };
  }
}

function pinWorld(c, i) {
  const p = C[c.type].pins[i];
  const r = rot(p.x, p.y, c.angle);
  return { x: c.x + r.x, y: c.y + r.y };
}

// Welche Leitungs-Punkte liegen auf Pins dieses Bauteils?
function attachedEnds(c) {
  const out = [];
  const def = C[c.type];
  for(const wire of state.wires)
    for(let idx = 0; idx < wire.points.length; idx++)
      for(let i = 0; i < def.pins.length; i++) {
        const p = pinWorld(c, i);
        if(Math.abs(wire.points[idx].x - p.x) <= 2 && Math.abs(wire.points[idx].y - p.y) <= 2)
          out.push({ wire, idx, pin: i });
      }
  return out;
}

function moveAttached(c, ends) {
  for(const a of ends) {
    const p = pinWorld(c, a.pin);
    moveWirePoint(a.wire, a.idx, p.x, p.y);
    renderWire(a.wire);
  }
}

// Verschiebt einen Leitungspunkt und hält angrenzende, innere Eckpunkte rechtwinklig
function moveWirePoint(wire, idx, nx, ny) {
  const pts = wire.points, p = pts[idx];
  if(pts.length === 2) {
    // gerade Leitung bleibt rechtwinklig: bei Verschiebung wird eine Ecke eingefügt
    const o = pts[1 - idx];
    const horiz = o.y === p.y, vert = o.x === p.x;
    p.x = nx; p.y = ny;
    if(horiz !== vert && ((horiz && ny !== o.y) || (vert && nx !== o.x)) && !(horiz && nx === o.x) && !(vert && ny === o.y)) {
      const corner = horiz ? { x: nx, y: o.y } : { x: o.x, y: ny };
      pts.splice(1, 0, corner);
    }
    return;
  }
  for(const i of [idx - 1, idx + 1]) {
    if(i <= 0 || i >= pts.length - 1) continue;
    const q = pts[i];
    if(q.y === p.y && q.x !== p.x) q.y = ny;
    else if(q.x === p.x && q.y !== p.y) q.x = nx;
  }
  p.x = nx; p.y = ny;
}

  ['Schalter', ['switch','button','switch2','relay']],
  ['Verbraucher', ['lamp','motor','bell','speaker']],
  ['Passiv', ['resistor','potentiometer','ldr','ntc','capacitor','polarized_capacitor','inductor','inductor_core','fuse']],
  ['Halbleiter', ['diode','led','zener','npn','pnp']],
  ['Messen & Pfeile', ['meter','ammeter','varrow','iarrow']],
  ['Sonstige', ['transformer','transformer_air','opamp','and_gate','or_gate','not_gate']],
];

function initPalette() {
  // Weiche Trennstellen für lange Namen in der schmalen Palette
  const short = {
    potentiometer: 'Potentio\u00ADmeter', capacitor: 'Konden\u00ADsator', dc_source: 'Gleich\u00ADspannungs\u00ADquelle',
    ac_source: 'Wechsel\u00ADspannungs\u00ADquelle', meter: 'Spannungs\u00ADmesser', ammeter: 'Strom\u00ADmesser',
    opamp: 'Operations\u00ADverstärker', ldr: 'Foto\u00ADwiderstand', ntc: 'Heiß\u00ADleiter (NTC)',
    switch2: 'Wechsel\u00ADschalter', speaker: 'Laut\u00ADsprecher', varrow: 'Spannungs\u00ADpfeil', iarrow: 'Strom\u00ADpfeil',
  };
  const sidebar = $('sidebar');
  for(const [title, keys] of PALETTE) {
    const h = document.createElement('h3');
    h.textContent = title;
    const container = document.createElement('div');
    container.className = 'parts';
    sidebar.append(h, container);
    for(const key of keys) {
      const def = C[key];
      if(!def) continue;
      const btn = document.createElement('div');
      btn.className = 'part-btn';
      btn.dataset.type = key;
      btn.title = def.name + ' – antippen oder auf die Fläche ziehen';
      const w = Math.max(def.w, 60), h = Math.max(def.h, 40);
      const vb = `${-w/2 - 4} ${-h/2 - 4} ${w + 8} ${h + 8}`;
      btn.innerHTML = `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">${compBodySVG({ type:key, showPolarity:true })}</svg><span>${short[key] || def.name}</span>`;
      btn.addEventListener('pointerdown', e => { if(e.button === 0) startPlace(key, e); });
      container.appendChild(btn);
    }
  }
}

function enterPlaceMode(type) {
  cancelTransient();
  state.tool = 'place';
  state.placeType = type;
  setToolUI('place');
  showPreview(type);
}

// Antippen = Platziermodus (jedes Tippen auf die Fläche setzt ein Bauteil, „Fertig“ beendet);
// auf die Fläche ziehen = ein Bauteil setzen. Scrollt der Browser die Palette, passiert nichts.
function startPlace(type, e) {
  const sx = e.clientX, sy = e.clientY;
  let dragged = false;
  track(ev => {
    if(!dragged) {
      if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
      dragged = true;
      enterPlaceMode(type);
    }
    movePreview(ev);
  }, (ev, cancelled) => {
    if(!dragged) { if(!cancelled) enterPlaceMode(type); return; }
    if(state.tool !== 'place') return;
    if(!cancelled && overCanvas(ev)) placeAt(ev);
    setTool('select');
  }, e.pointerId);
}

function overCanvas(e) {
  const t = document.elementFromPoint(e.clientX, e.clientY);
  return !!(t && t.closest && t.closest('#canvas'));
}

function showPreview(type) {
  $('temp-layer').innerHTML = `<g id="place-preview" opacity="0.5" style="display:none" pointer-events="none">${compBodySVG({ type, showPolarity:true })}</g>`;
}

function movePreview(e) {
  const pv = $('place-preview');
  if(!pv) return;
  const pos = getSnappedPos(e);
  pv.style.display = '';
  pv.setAttribute('transform', `translate(${pos.x},${pos.y})`);
  $('cursor-pos').textContent = `X: ${pos.x}  Y: ${pos.y}`;
}

function placeAt(e) {
  const pos = getSnappedPos(e);
  const comp = addComponent(state.placeType, pos.x, pos.y);
  if(comp) { select('c', comp.id); pushHistory(); }
}

// ============================================================
// BAUTEILE
// ============================================================

function newComp(type, x, y, extra) {
  return Object.assign({ id: genId(), type, x, y, label: '', value: '', angle: 0, showPolarity: false, labelOff: { x: 0, y: 32 } }, extra);
}

function addComponent(type, x, y) {
  const def = C[type];
  if(!def) return null;
  const comp = newComp(type, x, y, { label: getNextId(def.prefix, def.subLabel), labelOff: { ...(def.labelOff || { x: 0, y: 32 }) } });
  state.components.push(comp);
  renderComp(comp);
  return comp;
}

// Markup des Symbols (ohne Beschriftung); identisch für Anzeige, Palette und Export
function compBodySVG(comp) {
  const svg = C[comp.type].svg;
  let s = typeof svg === 'function' ? svg(comp._sim ? { ...comp, ...comp._sim } : comp) : svg;
  // Schrift im Symbol (V, A, M, +, −, &, ≥1 …) bleibt beim Drehen aufrecht
  const a = comp.angle || 0;
  if(a) s = s.replace(/<text([^>]*?) x="(-?[\d.]+)" y="(-?[\d.]+)"/g, (m, pre, x, y) => `<text${pre} x="${x}" y="${y}" transform="rotate(${-a} ${x} ${y})"`);
  if(!comp.showPolarity) s = s.replace(/<text class="(?:bat|cap)-plus"[^>]*>[^<]*<\/text>/, '');
  return s;
}

function compLabelSVG(comp) {
  const lo = comp.labelOff || { x: 0, y: 32 };
  let s = `<g class="comp-label" transform="translate(${lo.x},${lo.y})" style="cursor:move">`;
  s += `<text class="label-text" x="0" y="9" font-size="11" font-family="Inter,sans-serif" fill="#000" text-anchor="middle">${escapeXml(latexToUnicode(comp.label))}</text>`;
  if(comp.value) s += `<text class="value-text" x="0" y="23" font-size="10" font-family="Inter,sans-serif" fill="#555" text-anchor="middle">${escapeXml(latexToUnicode(comp.value))}</text>`;
  return s + '</g>';
}

function renderComp(comp) {
  const def = C[comp.type];
  if(!def) return;
  $('c-' + comp.id)?.remove();
  const g = el('g', { id: 'c-' + comp.id, transform: `translate(${comp.x},${comp.y})` }, $('components-layer'));

  // Unsichtbare Fläche: das Symbol ist auch zwischen seinen Linien greifbar
  const pad = COARSE ? 4 : 0;
  let pinsHit = `<rect class="comp-hit" x="${-def.w / 2 - pad}" y="${-def.h / 2 - pad}" width="${def.w + pad * 2}" height="${def.h + pad * 2}" fill="transparent"/>`;
  def.pins.forEach((pin, i) => { pinsHit += `<circle class="pin-handle" data-pin="${i}" cx="${pin.x}" cy="${pin.y}" r="${COARSE ? 12 : 9}" fill="transparent"/>`; });
  const rotAttr = comp.angle ? ` transform="rotate(${comp.angle})"` : '';
  let blank = '';
  if(comp.blank) { const bb = blankBox(comp); blank = `<rect class="blank-mark" x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}"/>`; }
  g.innerHTML = `<g class="comp-body"${rotAttr}>${compBodySVG(comp)}${blank}${pinsHit}</g>${compLabelSVG(comp)}`;
  g.classList.toggle('comp-blank', !!comp.blank);

  g.querySelector('.comp-label').addEventListener('pointerdown', e => {
    if(state.tool !== 'select' || e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    select('c', comp.id);
    if(doubleTap(e, 'c' + comp.id)) { openCompDialog(comp.id); return; }
    startLabelDrag(comp.id, e);
  });
  g.addEventListener('pointerdown', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    if(e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    if(state.sim && simInteract(comp, e)) return;
    if(inMulti('c', comp.id)) { startGroupDrag(e); return; }
    select('c', comp.id);
    if(doubleTap(e, 'c' + comp.id)) { openCompDialog(comp.id); return; }
    const pin = e.target.closest('.pin-handle');
    if(pin) startPinWire(comp, +pin.dataset.pin, e);
    else startCompDrag(comp.id, e);
  });
  g.addEventListener('dblclick', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    openCompDialog(comp.id);
  });
  g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if(state.tool === 'place') { setTool('select'); return; }
    select('c', comp.id);
    showCompContextMenu(comp.id, e);
  });
  applySelection();
}

function showMenu(e, html) {
  const menu = $('context-menu');
  menu.innerHTML = html;
  menu.style.display = 'block';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - mw - 4)) + 'px';
  menu.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - mh - 4)) + 'px';
}

function closeMenu() { $('context-menu').style.display = 'none'; }
document.addEventListener('pointerdown', e => { if(!e.target.closest || !e.target.closest('#context-menu')) closeMenu(); }, true);
// Jeder Menüpunkt schließt das Menü (nachdem sein onclick gelaufen ist)
$('context-menu').addEventListener('click', e => { if(e.target.closest('button')) closeMenu(); });

const menuItem = (ic, txt, fn, key) => `<button onclick="${fn}">${icon(ic)}<span>${txt}</span>${key ? `<span class="key">${key}</span>` : ''}</button>`;

function showCompContextMenu(id, e) {
  showMenu(e, menuItem('edit', 'Bearbeiten', `openCompDialog('${id}')`)
    + menuItem('rotate', 'Drehen (90°)', `rotateComp('${id}')`, 'R')
    + '<hr>' + menuItem('dup', 'Duplizieren', `duplicateComp('${id}')`, 'Strg+D')
    + menuItem('del', 'Löschen', 'deleteSelected()', 'Entf'));
}

function openMenu(name, btn) {
  const r = btn.getBoundingClientRect();
  showMenu({ clientX: r.left, clientY: r.bottom + 4 }, MENUS[name]());
}

// Aktionsleiste unten für die aktuelle Auswahl – ersetzt Rechtsklick und Tastenkürzel
function updateSelBar() {
  const bar = $('selbar'), s = state.sel, n = state.multi.length;
  if((!s && !n) || state.tool !== 'select') { bar.hidden = true; return; }
  const b = (ic, txt, fn, cls) => `<button class="tb${cls ? ' ' + cls : ''}" onclick="${fn}" title="${txt}">${icon(ic)}<span class="l3">${txt}</span></button>`;
  let h = '';
  if(n) {
    h = `<span class="selname">${n} Objekte</span>`
      + b('rotate', 'Drehen', 'rotateSelected()') + b('dup', 'Duplizieren', 'duplicateSelected()')
      + b('blank', 'Lücke', 'toggleBlankSelected()') + b('del', 'Löschen', 'deleteSelected()', 'danger');
  } else if(s.type === 'c') {
    const comp = state.components.find(c => c.id === s.id);
    if(!comp) { bar.hidden = true; return; }
    h = `<span class="selname">${escapeXml(latexToUnicode(comp.label))}</span>`
      + b('edit', 'Bearbeiten', `openCompDialog('${s.id}')`) + b('rotate', 'Drehen', 'rotateSelected()')
      + b('dup', 'Duplizieren', 'duplicateSelected()') + b('del', 'Löschen', 'deleteSelected()', 'danger');
  } else if(s.type === 'l') {
    h = `<span class="selname">Text</span>` + b('edit', 'Bearbeiten', `openTextDialog('${s.id}')`)
      + b('dup', 'Duplizieren', 'duplicateSelected()') + b('del', 'Löschen', 'deleteSelected()', 'danger');
  } else {
    const wire = state.wires.find(w => w.id === s.id);
    h = `<span class="selname">Leitung</span>` + b('blank', wire && wire.blank ? 'Keine Lücke' : 'Lücke', 'toggleBlankSelected()')
      + b('del', 'Löschen', 'deleteSelected()', 'danger');
  }
  bar.innerHTML = h;
  bar.hidden = false;
}

function rotateComp(id) {
  const comp = state.components.find(c => c.id === id);
  if(!comp) return;
  const ends = attachedEnds(comp);
  comp.angle = ((comp.angle || 0) + 90) % 360;
  renderComp(comp);
  moveAttached(comp, ends);
  updateJunctions();
  pushHistory();
  closeMenu();
}

function rotateSelected() {
  if(state.multi.length) rotateGroup();
  else if(state.sel && state.sel.type === 'c') rotateComp(state.sel.id);
  else showToast('Erst ein Bauteil auswählen');
}

function duplicateComp(id) {
  select('c', id);
  duplicateSelected();
}

function duplicateSelected() {
  const clip = clipFromSelection();
  if(!clip) { showToast('Nichts ausgewählt'); return; }
  pasteClip(clip, 24, 24);
  closeMenu();
}

window.rotateComp = rotateComp;
window.duplicateComp = duplicateComp;

// ============================================================
// AUSWAHL
// ============================================================

function select(type, id) {
  state.sel = { type, id };
  state.multi = [];
  applySelection();
}

function clearSelection() {
  state.sel = null;
  state.multi = [];
  applySelection();
}

function applySelection() {
  document.querySelectorAll('.comp-selected').forEach(g => g.classList.remove('comp-selected'));
  document.querySelectorAll('.wire-sel').forEach(g => g.classList.remove('wire-sel'));
  document.querySelectorAll('.label-sel').forEach(g => g.classList.remove('label-sel'));
  document.querySelectorAll('.wire-handle').forEach(h => h.remove());
  updateSelBar();
  for(const it of selectionItems()) {
    if(it.type === 'c') $('c-' + it.id)?.classList.add('comp-selected');
    else if(it.type === 'l') $('l-' + it.id)?.classList.add('label-sel');
    else $('w-' + it.id)?.classList.add('wire-sel');
  }
  // Eckpunkte zum Ziehen nur bei einer einzeln gewählten Leitung
  const s = state.sel;
  if(s && s.type === 'w') {
    const g = $('w-' + s.id), wire = state.wires.find(w => w.id === s.id);
    if(g && wire) for(const p of wire.points) el('circle', { cx: p.x, cy: p.y, r: COARSE ? 6 : 3.5, class: 'wire-handle' }, g);
  }
}

// ============================================================
// BAUTEIL VERSCHIEBEN
// ============================================================

function startCompDrag(id, e) {
  const comp = state.components.find(c => c.id === id);
  if(!comp) return;
  const pos = getSnappedPos(e);
  const ofs = { x: comp.x - pos.x, y: comp.y - pos.y };
  const ends = attachedEnds(comp);
  const sx = e.clientX, sy = e.clientY;
  let moved = false;

  track(ev => {
    if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
    moved = true;
    const p = getSnappedPos(ev);
    comp.x = p.x + ofs.x; comp.y = p.y + ofs.y;
    $('c-' + id)?.setAttribute('transform', `translate(${comp.x},${comp.y})`);
    $('cursor-pos').textContent = `X: ${comp.x}  Y: ${comp.y}`;
    moveAttached(comp, ends);
    updateJunctions();
  }, () => { if(moved) pushHistory(); }, e.pointerId);
}

// Im Auswahlmodus: vom Anschluss eines Bauteils aus ziehen = neue Leitung
function startPinWire(comp, pinIdx, e) {
  const start = pinWorld(comp, pinIdx);
  const sx = e.clientX, sy = e.clientY;
  let dragging = false;
  track(ev => {
    if(!dragging) {
      if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
      dragging = true;
      state.wireStart = { x: start.x, y: start.y, pin: true };
    }
    updateWire(getWirePoint(ev), ev.shiftKey);
  }, (ev, cancelled) => {
    if(!dragging) return;
    if(cancelled) cancelWire();
    else finishWire(getWirePoint(ev), ev.shiftKey);
  }, e.pointerId);
}

function startLabelDrag(id, e) {
  const comp = state.components.find(c => c.id === id);
  if(!comp) return;
  const pos = getRawPos(e);
  if(!comp.labelOff) comp.labelOff = { x: 0, y: 32 };
  const ofs = { x: comp.labelOff.x - (pos.x - comp.x), y: comp.labelOff.y - (pos.y - comp.y) };
  let moved = false;
  track(ev => {
    moved = true;
    const p = getRawPos(ev);
    comp.labelOff.x = Math.round(p.x - comp.x + ofs.x);
    comp.labelOff.y = Math.round(p.y - comp.y + ofs.y);
    $('c-' + id)?.querySelector('.comp-label')?.setAttribute('transform', `translate(${comp.labelOff.x},${comp.labelOff.y})`);
  }, () => { if(moved) pushHistory(); }, e.pointerId);
}

// ============================================================
// LEITUNGEN
// ============================================================

function routePoints(s, ex, ey, diagonal) {
  if(diagonal || state.diagonal || s.x === ex || s.y === ey) return [{ x: s.x, y: s.y }, { x: ex, y: ey }];
  const dx = Math.abs(ex - s.x), dy = Math.abs(ey - s.y);
  return dx >= dy
    ? [{ x: s.x, y: s.y }, { x: ex, y: s.y }, { x: ex, y: ey }]
    : [{ x: s.x, y: s.y }, { x: s.x, y: ey }, { x: ex, y: ey }];
}

function drawWirePreview(points) {
  let d = `M ${points[0].x} ${points[0].y}`;
  for(let i = 1; i < points.length; i++) d += ` L ${points[i].x} ${points[i].y}`;
  const s = state.wireStart;
  $('temp-layer').innerHTML = `<path d="${d}" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="6,4" pointer-events="none"/><circle cx="${s.x}" cy="${s.y}" r="4" fill="#2563eb" pointer-events="none"/>`;
}

function showSnapIndicator(pt) {
  let ind = $('snap-ind');
  if(!pt || !pt.pin) { ind?.remove(); return; }
  if(!ind) ind = el('circle', { id: 'snap-ind', r: 6, fill: 'none', stroke: '#16a34a', 'stroke-width': 1.5, 'pointer-events': 'none' }, $('temp-layer'));
  ind.setAttribute('cx', pt.x); ind.setAttribute('cy', pt.y);
}

function startWire(pt) {
  state.wireStart = pt;
  drawWirePreview([pt, pt]);
  updateHint();
}

function cancelWire() {
  state.wireStart = null;
  $('temp-layer').innerHTML = '';
  updateHint();
}

// Werkzeug „Leitung“: Start und Ziel antippen/klicken – oder in einem Zug ziehen.
// Ist ein Startpunkt gesetzt, kann der Endpunkt vor dem Loslassen noch verschoben werden.
function wireGesture(e) {
  const down = getWirePoint(e), hadStart = !!state.wireStart;
  const sx = e.clientX, sy = e.clientY;
  let dragging = false;
  track(ev => {
    if(!dragging) {
      if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
      dragging = true;
      if(!hadStart) startWire(down);
    }
    updateWire(getWirePoint(ev), ev.shiftKey);
  }, (ev, cancelled) => {
    if(cancelled) { if(dragging && !hadStart) cancelWire(); return; }
    if(dragging) finishWire(getWirePoint(ev), ev.shiftKey);
    else if(hadStart) finishWire(down, ev.shiftKey);
    else startWire(down);
  }, e.pointerId);
}

function updateWire(pt, shift) {
  if(!state.wireStart) return;
  drawWirePreview(routePoints(state.wireStart, pt.x, pt.y, shift));
  showSnapIndicator(pt);
}

function finishWire(pt, shift) {
  const s = state.wireStart;
  $('temp-layer').innerHTML = '';
  state.wireStart = null;
  updateHint();
  if(!s || (s.x === pt.x && s.y === pt.y)) return;
  const wire = { id: genId(), points: routePoints(s, pt.x, pt.y, shift) };
  state.wires.push(wire);
  renderWire(wire);
  updateJunctions();
  pushHistory();
}

function renderWire(wire) {
  $('w-' + wire.id)?.remove();
  const pts = wire.points;
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
  const g = el('g', { id: 'w-' + wire.id, class: 'wire-g' + (wire.blank ? ' wire-blank' : '') }, $('wires-layer'));
  el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 14, class: 'wire-hit' }, g);
  el('path', { d, fill: 'none', stroke: '#000', 'stroke-width': 1, class: 'wire', 'stroke-linejoin': 'round', style: 'cursor:pointer' }, g);

  g.addEventListener('pointerdown', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    if(e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    if(inMulti('w', wire.id)) { startGroupDrag(e); return; }
    select('w', wire.id);
    const raw = getRawPos(e);
    const tol = (isTouch(e) ? 18 : 8) / state.view.k;
    const idx = wire.points.findIndex(p => Math.abs(raw.x - p.x) <= tol && Math.abs(raw.y - p.y) <= tol);
    if(idx >= 0) startWireVertexDrag(wire, idx, e);
  });
  g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if(state.tool !== 'select') return;
    select('w', wire.id);
    showMenu(e, menuItem('del', 'Leitung löschen', `deleteWire('${wire.id}')`, 'Entf'));
  });
  if((state.sel && state.sel.type === 'w' && state.sel.id === wire.id) || inMulti('w', wire.id)) applySelection();
}

function startWireVertexDrag(wire, idx, e) {
  const sx = e.clientX, sy = e.clientY;
  let moved = false;
  track(ev => {
    if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
    moved = true;
    const p = getWirePoint(ev);
    moveWirePoint(wire, idx, p.x, p.y);
    renderWire(wire);
    updateJunctions();
  }, () => { if(moved) pushHistory(); }, e.pointerId);
}

function deleteWire(id) {
  state.wires = state.wires.filter(w => w.id !== id);
  $('w-' + id)?.remove();
  if(state.sel && state.sel.id === id) state.sel = null;
  updateJunctions();
  pushHistory();
  closeMenu();
}
window.deleteWire = deleteWire;

// ============================================================
// VERBINDUNGSPUNKTE (Knoten)
// ============================================================
// Ein Punkt wird zum Knoten, wenn dort mindestens 3 "Arme" zusammentreffen:
// Leitungsenden/Ecken zählen 1, durchlaufende Leitungen 2, Bauteil-Pins 1.

const jKey = j => j.x + ',' + j.y;
const jId = j => 'j' + String(jKey(j)).replace(/-/g, 'm').replace(',', '_');

function segIntersect(a, b, c, d) {
  const denom = (d.y - c.y) * (b.x - a.x) - (d.x - c.x) * (b.y - a.y);
  if(Math.abs(denom) < 0.001) return null;
  const ua = ((d.x - c.x) * (a.y - c.y) - (d.y - c.y) * (a.x - c.x)) / denom;
  const ub = ((b.x - a.x) * (a.y - c.y) - (b.y - a.y) * (a.x - c.x)) / denom;
  if(ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) return { x: a.x + ua * (b.x - a.x), y: a.y + ua * (b.y - a.y) };
  return null;
}

function onSegment(p, a, b) {
  const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
  if(l2 === 0) return false;
  let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
  if(t < 0 || t > 1) return false;
  return Math.hypot(a.x + t * (b.x - a.x) - p.x, a.y + t * (b.y - a.y) - p.y) <= 0.75;
}

function updateJunctions() {
  const old = new Map(state.junctions.map(j => [jKey(j), j]));
  const segs = [];
  for(const w of state.wires)
    for(let i = 0; i < w.points.length - 1; i++)
      if(w.points[i].x !== w.points[i+1].x || w.points[i].y !== w.points[i+1].y) segs.push({ a: w.points[i], b: w.points[i+1] });

  const cand = new Map();
  const addCand = (x, y) => { x = Math.round(x); y = Math.round(y); cand.set(x + ',' + y, { x, y }); };
  for(const w of state.wires) for(const p of w.points) addCand(p.x, p.y);
  for(let i = 0; i < segs.length; i++)
    for(let j = i + 1; j < segs.length; j++) {
      const p = segIntersect(segs[i].a, segs[i].b, segs[j].a, segs[j].b);
      if(p) addCand(p.x, p.y);
    }

  const pins = [];
  for(const c of state.components) for(let i = 0; i < C[c.type].pins.length; i++) pins.push(pinWorld(c, i));

  const result = [];
  for(const p of cand.values()) {
    let arms = 0;
    for(const s of segs) {
      if((Math.abs(s.a.x - p.x) <= 0.75 && Math.abs(s.a.y - p.y) <= 0.75) || (Math.abs(s.b.x - p.x) <= 0.75 && Math.abs(s.b.y - p.y) <= 0.75)) arms += 1;
      else if(onSegment(p, s.a, s.b)) arms += 2;
    }
    for(const q of pins) if(Math.abs(q.x - p.x) <= 2 && Math.abs(q.y - p.y) <= 2) arms += 1;
    if(arms >= 3) {
      const prev = old.get(jKey(p));
      result.push({ x: p.x, y: p.y, disconnected: !!(prev && prev.disconnected), removed: !!(prev && prev.removed) });
    }
  }
  state.junctions = result;
  renderJunctions();
}

function renderJunctions() {
  const layer = $('junctions-layer');
  layer.innerHTML = '';
  for(const j of state.junctions) {
    if(j.removed) continue;
    const g = el('g', { id: jId(j), transform: `translate(${j.x},${j.y})`, class: 'junction' }, layer);
    el('circle', { r: COARSE ? 13 : 8, fill: 'transparent', style: state.tool === 'select' ? 'cursor:pointer' : '' }, g);
    if(j.disconnected) el('path', { d: 'M-5,-3 Q0,5 5,-3', fill: 'none', stroke: '#dc2626', 'stroke-width': 1, 'pointer-events': 'none' }, g);
    else el('circle', { r: 3, fill: '#000', class: 'junction-dot', 'pointer-events': 'none' }, g);
    g.addEventListener('pointerdown', e => { if(state.tool === 'select') e.stopPropagation(); });
    g.addEventListener('click', e => {
      if(state.tool !== 'select') return;
      e.stopPropagation();
      showJunctionMenu(j, e);
    });
  }
}

function showJunctionMenu(j, e) {
  const k = jKey(j);
  showMenu(e, `
    <button onclick="toggleJunction('${k}')">${j.disconnected ? 'Als verbunden markieren' : 'Als nicht verbunden markieren'}</button>
    <hr>
    <button onclick="removeJunction('${k}')">Verbindungspunkt entfernen</button>`);
}

function toggleJunction(k) {
  const j = state.junctions.find(x => jKey(x) === k);
  if(!j) return;
  j.disconnected = !j.disconnected;
  renderJunctions();
  pushHistory();
  closeMenu();
}
function removeJunction(k) {
  const j = state.junctions.find(x => jKey(x) === k);
  if(!j) return;
  j.removed = true;
  renderJunctions();
  pushHistory();
  closeMenu();
}
window.toggleJunction = toggleJunction;
window.removeJunction = removeJunction;

function deleteSelected() {
  const items = selectionItems();
  if(!items.length) { showToast('Nichts ausgewählt'); return; }
  const ids = new Set(items.map(it => it.id));
  state.components = state.components.filter(c => { if(ids.has(c.id)) { $('c-' + c.id)?.remove(); return false; } return true; });
  state.wires = state.wires.filter(w => { if(ids.has(w.id)) { $('w-' + w.id)?.remove(); return false; } return true; });
  state.labels = state.labels.filter(l => { if(ids.has(l.id)) { $('l-' + l.id)?.remove(); return false; } return true; });
  state.sel = null;
  state.multi = [];
  updateJunctions();
  applySelection();
  pushHistory();
  closeMenu();
}

// Aktuelle Auswahl als Liste {type, id} – egal ob einzeln oder als Gruppe
function selectionItems() {
  return state.multi.length ? state.multi : (state.sel ? [state.sel] : []);
}
// Arbeitsblatt: gewählte Bauteile/Leitungen als Lücke markieren (Export „Aufgabe“ lässt sie leer)
function toggleBlankSelected() {
  const { comps, wires } = selectedObjects();
  const objs = [...comps, ...wires];
  if(!objs.length) { showToast('Erst Bauteile oder Leitungen auswählen'); return; }
  const on = objs.some(o => !o.blank);
  objs.forEach(o => { o.blank = on; });
  comps.forEach(renderComp);
  wires.forEach(renderWire);
  applySelection();
  pushHistory();
  showToast(on ? 'Als Lücke markiert – im Export „Aufgabe“ bleibt sie leer' : 'Lücke aufgehoben');
}

function selectAll() {
  selectMany([
    ...state.components.map(c => ({ type: 'c', id: c.id })),
    ...state.wires.map(w => ({ type: 'w', id: w.id })),
    ...state.labels.map(l => ({ type: 'l', id: l.id })),
  ]);
}
const inMulti = (type, id) => state.multi.some(it => it.type === type && it.id === id);

function selectMany(items) {
  if(items.length === 1) { select(items[0].type, items[0].id); return; }
  state.sel = null;
  state.multi = items;
  applySelection();
}

// Objekte der Auswahl auflösen
function selectedObjects(items = selectionItems()) {
  const has = (t, id) => items.some(it => it.type === t && it.id === id);
  return {
    comps: state.components.filter(c => has('c', c.id)),
    wires: state.wires.filter(w => has('w', w.id)),
    labels: state.labels.filter(l => has('l', l.id)),
  };
}

// Rahmen-Werkzeug: alles, was vollständig im Rahmen liegt, wird ausgewählt
function lassoGesture(e) {
  const s = getRawPos(e);
  const layer = $('temp-layer');
  const box = p => ({ x: Math.min(s.x, p.x), y: Math.min(s.y, p.y), w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y) });
  const draw = b => { layer.innerHTML = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#2563eb14" stroke="#2563eb" stroke-width="${1 / state.view.k}" stroke-dasharray="${4 / state.view.k} ${3 / state.view.k}" pointer-events="none"/>`; };
  draw(box(s));
  track(ev => draw(box(getRawPos(ev))), (ev, cancelled) => {
    layer.innerHTML = '';
    if(cancelled) return;
    const b = box(getRawPos(ev));
    const inside = (x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
    const items = [];
    for(const c of state.components) if(inside(c.x, c.y)) items.push({ type: 'c', id: c.id });
    for(const w of state.wires) if(w.points.every(p => inside(p.x, p.y))) items.push({ type: 'w', id: w.id });
    for(const l of state.labels) if(inside(l.x, l.y)) items.push({ type: 'l', id: l.id });
    if(state.tool === 'lasso') setTool('select');
    if(items.length) selectMany(items); else clearSelection();
    if(items.length > 1) showToast(`${items.length} Objekte ausgewählt`);
  }, e.pointerId);
}

// Gruppe verschieben: ausgewählte Leitungen wandern mit, angeschlossene Leitungen werden nachgeführt
function startGroupDrag(e) {
  const { comps, wires, labels } = selectedObjects();
  const wireIds = new Set(wires.map(w => w.id));
  const orig = {
    c: comps.map(c => ({ x: c.x, y: c.y })),
    w: wires.map(w => w.points.map(p => ({ ...p }))),
    l: labels.map(l => ({ x: l.x, y: l.y })),
  };
  const ends = comps.map(c => attachedEnds(c).filter(a => !wireIds.has(a.wire.id)));
  const start = getSnappedPos(e), sx = e.clientX, sy = e.clientY;
  let moved = false;
  track(ev => {
    if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
    moved = true;
    const p = getSnappedPos(ev), dx = p.x - start.x, dy = p.y - start.y;
    comps.forEach((c, i) => {
      c.x = orig.c[i].x + dx; c.y = orig.c[i].y + dy;
      $('c-' + c.id)?.setAttribute('transform', `translate(${c.x},${c.y})`);
      moveAttached(c, ends[i]);
    });
    wires.forEach((w, i) => { w.points = orig.w[i].map(q => ({ x: q.x + dx, y: q.y + dy })); renderWire(w); });
    labels.forEach((l, i) => { l.x = orig.l[i].x + dx; l.y = orig.l[i].y + dy; $('l-' + l.id)?.setAttribute('transform', `translate(${l.x},${l.y})`); });
    updateJunctions();
    applySelection();
  }, () => { if(moved) pushHistory(); }, e.pointerId);
}

// Gruppe um 90° um ihren (gerasterten) Mittelpunkt drehen
function rotateGroup() {
  const { comps, wires, labels } = selectedObjects();
  const pts = [...comps.map(c => ({ x: c.x, y: c.y })), ...wires.flatMap(w => w.points), ...labels.map(l => ({ x: l.x, y: l.y }))];
  if(!pts.length) return;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const cx = snap((Math.min(...xs) + Math.max(...xs)) / 2), cy = snap((Math.min(...ys) + Math.max(...ys)) / 2);
  const turn = p => ({ x: cx - (p.y - cy), y: cy + (p.x - cx) });
  const wireIds = new Set(wires.map(w => w.id));
  const ends = comps.map(c => attachedEnds(c).filter(a => !wireIds.has(a.wire.id)));
  comps.forEach((c, i) => {
    Object.assign(c, turn(c));
    c.angle = ((c.angle || 0) + 90) % 360;
    renderComp(c);
    moveAttached(c, ends[i]);
  });
  wires.forEach(w => { w.points = w.points.map(turn); renderWire(w); });
  labels.forEach(l => { Object.assign(l, turn(l)); renderText(l); });
  updateJunctions();
  applySelection();
  pushHistory();
}

// Zwischenablage: liegt in localStorage, damit Einfügen auch in einem anderen Tab/Projekt klappt
const CLIP_KEY = 'vectronix-clipboard-v1';

function clipFromSelection() {
  const { comps, wires, labels } = selectedObjects();
  if(!comps.length && !wires.length && !labels.length) return null;
  return JSON.parse(JSON.stringify({ components: comps.map(({ _sim, ...c }) => c), wires, labels }));
}

function copySelection() {
  const clip = clipFromSelection();
  if(!clip) { showToast('Nichts ausgewählt'); return; }
  try { localStorage.setItem(CLIP_KEY, JSON.stringify(clip)); } catch(e) {}
  state.clip = clip;
  state.pasteCount = 0;
  const n = clip.components.length + clip.wires.length + clip.labels.length;
  showToast(n === 1 ? 'Kopiert' : `${n} Objekte kopiert`);
}

function pasteClipboard() {
  let clip = state.clip;
  try { const s = localStorage.getItem(CLIP_KEY); if(s) clip = JSON.parse(s); } catch(e) {}
  if(!clip) { showToast('Zwischenablage ist leer'); return; }
  state.pasteCount = (state.pasteCount || 0) + 1;
  pasteClip(clip, 24 * state.pasteCount, 24 * state.pasteCount);
}

// Fügt Kopien ein (neue IDs und fortlaufende Bezeichnungen) und wählt sie aus
function pasteClip(clip, dx, dy) {
  const items = [];
  for(const c of clip.components || []) {
    const def = C[c.type];
    if(!def) continue;
    const copy = newComp(c.type, c.x + dx, c.y + dy, {
      ...c, id: genId(), x: c.x + dx, y: c.y + dy,
      label: /\d/.test(c.label) ? getNextId(def.prefix, def.subLabel) : c.label,
      labelOff: { ...(c.labelOff || { x: 0, y: 32 }) },
    });
    state.components.push(copy);
    renderComp(copy);
    items.push({ type: 'c', id: copy.id });
  }
  for(const w of clip.wires || []) {
    const copy = { ...w, id: genId(), points: w.points.map(p => ({ x: p.x + dx, y: p.y + dy })) };
    state.wires.push(copy);
    renderWire(copy);
    items.push({ type: 'w', id: copy.id });
  }
  for(const l of clip.labels || []) {
    const copy = { ...l, id: genId(), x: l.x + dx, y: l.y + dy };
    state.labels.push(copy);
    renderText(copy);
    items.push({ type: 'l', id: copy.id });
  }
  if(!items.length) return;
  updateJunctions();
  selectMany(items);
  pushHistory();
}

function textSVG(l, extra) {
  const lines = String(l.text).split('\n');
  const tspans = lines.map((t, i) => `<tspan x="0" dy="${i ? l.size * 1.2 : 0}">${escapeXml(latexToUnicode(t))}</tspan>`).join('');
  return `<text${extra || ''} x="0" y="0" font-size="${l.size}" font-family="Inter,sans-serif" fill="#000">${tspans}</text>`;
}

function renderText(label) {
  $('l-' + label.id)?.remove();
  const g = el('g', { id: 'l-' + label.id, transform: `translate(${label.x},${label.y})`, style: 'cursor:move' }, $('labels-layer'));
  g.innerHTML = textSVG(label);
  g.addEventListener('pointerdown', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    if(e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    if(inMulti('l', label.id)) { startGroupDrag(e); return; }
    select('l', label.id);
    if(doubleTap(e, 'l' + label.id)) { openTextDialog(label.id); return; }
    startTextDrag(label.id, e);
  });
  g.addEventListener('dblclick', e => { if(state.tool === 'select') { e.stopPropagation(); openTextDialog(label.id); } });
  g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if(state.tool !== 'select') return;
    select('l', label.id);
    showMenu(e, menuItem('edit', 'Bearbeiten', `openTextDialog('${label.id}')`) + menuItem('del', 'Löschen', 'deleteSelected()', 'Entf'));
  });
  applySelection();
}

function openTextDialog(id) {
  const label = state.labels.find(l => l.id === id);
  if(!label) return;
  closeMenu();
  openDialog(`
    <h2>Text bearbeiten</h2>
    <label for="dlg-text">Text (mehrzeilig möglich, LaTeX-Symbole wie $\\Omega$ werden unterstützt)</label>
    <textarea id="dlg-text" rows="3">${escapeXml(label.text)}</textarea>
    <label for="dlg-size">Schriftgröße</label>
    <input type="number" id="dlg-size" value="${label.size}" min="6" max="72">
    <div class="btns">
      <button onclick="closeDialog()">Abbrechen</button>
      <button class="primary" onclick="saveText('${id}')">Speichern</button>
    </div>`, 'dlg-text');
  $('dlg-text').addEventListener('keydown', e => { if(e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); saveText(id); } });
}
window.openTextDialog = openTextDialog;

function saveText(id) {
  const label = state.labels.find(l => l.id === id);
  if(!label) return;
  label.text = $('dlg-text').value || 'Text';
  label.size = Math.min(72, Math.max(6, parseInt($('dlg-size').value) || 12));
  renderText(label);
  closeDialog();
  pushHistory();
}
window.saveText = saveText;

function startTextDrag(id, e) {
  const label = state.labels.find(l => l.id === id);
  if(!label) return;
  const pos = getSnappedPos(e);
  const ofs = { x: label.x - pos.x, y: label.y - pos.y };
  const sx = e.clientX, sy = e.clientY;
  let moved = false;
  track(ev => {
    if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < dragDist(ev)) return;
    moved = true;
    const p = getSnappedPos(ev);
    label.x = p.x + ofs.x; label.y = p.y + ofs.y;
    $('l-' + id)?.setAttribute('transform', `translate(${label.x},${label.y})`);
  }, () => { if(moved) pushHistory(); }, e.pointerId);
}

  const clip = templateClip(t);

  clip.wires.forEach(w => w.points.forEach(p => { xs.push(p.x); ys.push(p.y); }));
