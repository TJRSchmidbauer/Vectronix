// ============================================================
// QR-CODE (Byte-Modus, Fehlerkorrektur L/M, Versionen 1–40)
// ============================================================
// Eigene, kompakte Umsetzung nach ISO/IEC 18004 – kein externer Dienst, kein Netzwerk.

const QR = (() => {
  const ECC_PER_BLOCK = {
    L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
  };
  const NUM_BLOCKS = {
    L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
  };
  const FORMAT_BITS = { L: 1, M: 0 };

  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if(v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if(v >= 7) r -= 36; }
    return r;
  };
  const dataCodewords = (v, e) => Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[e][v] * NUM_BLOCKS[e][v];

  const gfMul = (x, y) => { let z = 0; for(let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 0xff; };
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1;
    let root = 1;
    for(let i = 0; i < deg; i++) {
      for(let j = 0; j < deg; j++) { r[j] = gfMul(r[j], root); if(j + 1 < deg) r[j] ^= r[j + 1]; }
      root = gfMul(root, 2);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for(const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gfMul(c, f); }); }
    return r;
  }

  function alignPositions(v) {
    if(v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const r = [6];
    for(let pos = size - 7; r.length < n; pos -= step) r.splice(1, 0, pos);
    return r;
  }

  function encode(bytes) {
    // kleinste Version mit L wählen, dann ggf. auf M verbessern
    let ver = 0, ecl = 'L';
    for(let v = 1; v <= 40; v++) {
      const bits = 4 + (v <= 9 ? 8 : 16) + bytes.length * 8;
      if(bits <= dataCodewords(v, 'L') * 8) { ver = v; break; }
    }
    if(!ver) throw new Error('Zu viele Daten für einen QR-Code');
    if(4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 <= dataCodewords(ver, 'M') * 8) ecl = 'M';

    // Bitstrom
    const bb = [];
    const put = (val, len) => { for(let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, ver <= 9 ? 8 : 16);
    for(const b of bytes) put(b, 8);
    const cap = dataCodewords(ver, ecl) * 8;
    put(0, Math.min(4, cap - bb.length));
    put(0, (8 - bb.length % 8) % 8);
    for(let pad = 0xec; bb.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8);
    const data = [];
    for(let i = 0; i < bb.length; i += 8) data.push(parseInt(bb.slice(i, i + 8).join(''), 2));

    // Fehlerkorrektur und Verschränkung
    const nb = NUM_BLOCKS[ecl][ver], eLen = ECC_PER_BLOCK[ecl][ver], raw = Math.floor(rawModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = rsDivisor(eLen);
    const blocks = [];
    for(let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if(i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for(let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if(i !== shortLen - eLen || j >= nShort) all.push(b[i]); });

    // Matrix
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for(let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    for(const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
      for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if(x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
      }
    const ap = alignPositions(ver), na = ap.length;
    for(let i = 0; i < na; i++) for(let j = 0; j < na; j++) {
      if((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++) setF(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = FORMAT_BITS[ecl] << 3 | mask;
      let rem = d;
      for(let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bits = (d << 10 | rem) ^ 0x5412, bit = i => ((bits >>> i) & 1) !== 0;
      for(let i = 0; i <= 5; i++) setF(8, i, bit(i));
      setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
      for(let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
      for(let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
      for(let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    if(ver >= 7) {
      let rem = ver;
      for(let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const bits = ver << 12 | rem;
      for(let i = 0; i < 18; i++) {
        const d = ((bits >>> i) & 1) !== 0, a = size - 11 + i % 3, b = Math.floor(i / 3);
        setF(a, b, d); setF(b, a, d);
      }
    }
    // Datenmodule im Zickzack
    let bi = 0;
    for(let right = size - 1; right >= 1; right -= 2) {
      if(right === 6) right = 5;
      for(let vert = 0; vert < size; vert++) for(let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if(!fn[y][x] && bi < all.length * 8) { mod[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
      }
    }
    // Maske mit der geringsten (vereinfachten) Strafwertung
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
    ];
    const applyMask = m => { for(let y = 0; y < size; y++) for(let x = 0; x < size; x++) if(!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for(let y = 0; y < size; y++) {
        let rx = 1, ry = 1;
        for(let x = 0; x < size; x++) {
          if(mod[y][x]) dark++;
          if(x > 0) {
            if(mod[y][x] === mod[y][x - 1]) { rx++; if(rx === 5) p += 3; else if(rx > 5) p++; } else rx = 1;
            if(mod[x][y] === mod[x - 1][y]) { ry++; if(ry === 5) p += 3; else if(ry > 5) p++; } else ry = 1;
          }
          if(x > 0 && y > 0 && mod[y][x] === mod[y][x - 1] && mod[y][x] === mod[y - 1][x] && mod[y][x] === mod[y - 1][x - 1]) p += 3;
        }
      }
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    };
    let best = 0, bestP = Infinity;
    for(let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const pn = penalty();
      if(pn < bestP) { bestP = pn; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size, modules: mod, version: ver, ecl };
  }

  // SVG mit 4 Modulen Ruhezone
  function toSVG(qr) {
    const n = qr.size + 8;
    let d = '';
    for(let y = 0; y < qr.size; y++) for(let x = 0; x < qr.size; x++) if(qr.modules[y][x]) d += `M${x + 4} ${y + 4}h1v1h-1z`;
    return `<svg xmlns="${SVG_NS}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  return { encode, toSVG };
})();

// ============================================================
// TEILEN PER LINK / QR-CODE
// ============================================================
// Die ganze Schaltung steckt komprimiert im Link (#p=…). Es wird nichts auf einem Server gespeichert.

const ONLINE_URL = 'https://tjrschmidbauer.github.io/Vectronix/';
const QR_MAX_BYTES = 2900;

const b64url = bytes => { let s = ''; for(const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = str => { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); };

// Kompakte Projektdaten: ohne IDs, Zähler und Standardwerte
function compactProject() {
  const comps = state.components.map(c => {
    const o = { type: c.type, x: c.x, y: c.y };
    if(c.angle) o.angle = c.angle;
    if(c.label) o.label = c.label;
    if(c.value) o.value = c.value;
    if(c.showPolarity) o.showPolarity = true;
    if(c.closed) o.closed = true;
    if(c.pos) o.pos = 1;
    if(c.blank) o.blank = true;
    if(c.dark) o.dark = true;
    if(c.hot) o.hot = true;
    const lo = c.labelOff, dl = C[c.type].labelOff || { x: 0, y: 32 };
    if(lo && (lo.x !== dl.x || lo.y !== dl.y)) o.labelOff = lo;
    return o;
  });
  return {
    version: 4,
    components: comps,
    wires: state.wires.map(w => ({ points: w.points, ...(w.blank ? { blank: true } : {}) })),
    labels: state.labels.map(l => ({ x: l.x, y: l.y, text: l.text, size: l.size })),
    junctions: state.junctions.filter(j => j.disconnected || j.removed),
  };
}

async function encodeProject() {
  let bytes = new TextEncoder().encode(JSON.stringify(compactProject())), tag = 'j';
  if(window.CompressionStream) {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    tag = 'z';
  }
  return tag + b64url(bytes);
}

async function decodeProject(code) {
  let bytes = unb64url(code.slice(1));
  if(code[0] === 'z') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

function shareBase() {
  return location.protocol.startsWith('http') ? location.href.split('#')[0] : ONLINE_URL;
}

async function openShareDialog() {
  closeMenu();
  if(!state.components.length && !state.wires.length && !state.labels.length) { showToast('Der Schaltplan ist noch leer'); return; }
  let url;
  try { url = shareBase() + '#p=' + await encodeProject(); }
  catch(e) { showToast('Link konnte nicht erzeugt werden: ' + e.message); return; }
  let qr = '';
  if(url.length <= QR_MAX_BYTES) {
    try { qr = QR.toSVG(QR.encode(new TextEncoder().encode(url))); } catch(e) { qr = ''; }
  }
  state.shareUrl = url;
  state.shareQR = qr;
  openDialog(`
    <h2>Schaltung teilen</h2>
    <div class="hint" style="margin:0 0 10px">Die Schaltung steckt komplett im Link. Es wird nichts hochgeladen oder auf einem Server gespeichert. Wer den Link öffnet, bekommt eine eigene Kopie.</div>
    ${qr ? `<div class="qr-box" onclick="showQRFullscreen()" title="Groß anzeigen">${qr}</div>`
         : `<div class="hint">Diese Schaltung ist zu groß für einen QR-Code (${url.length} Zeichen). Bitte den Link teilen oder das Projekt über „Datei → Speichern“ weitergeben.</div>`}
    <label for="share-url">Link</label>
    <input type="text" id="share-url" readonly value="${escapeXml(url)}">
    <div class="btns">
      <button onclick="closeDialog()">Schließen</button>
      ${qr ? '<button onclick="showQRFullscreen()">QR-Code groß (Beamer)</button>' : ''}
      <button class="primary" id="share-copy" onclick="copyShareLink()">Link kopieren</button>
    </div>`);
  $('share-url').addEventListener('focus', e => e.target.select());
}

function copyShareLink() {
  const done = () => { $('share-copy').textContent = '✔ Kopiert'; showToast('Link kopiert'); };
  const fallback = () => { const i = $('share-url'); i.focus(); i.select(); try { document.execCommand('copy') ? done() : showToast('Bitte den Link markieren und kopieren'); } catch(e) { showToast('Bitte den Link markieren und kopieren'); } };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(state.shareUrl).then(done, fallback);
  else fallback();
}

function showQRFullscreen() {
  const ov = document.createElement('div');
  ov.className = 'qr-full';
  ov.innerHTML = `${state.shareQR}<p>Mit der Kamera scannen, um die Schaltung zu öffnen · Tippen zum Schließen</p>`;
  ov.addEventListener('click', () => ov.remove());
  document.addEventListener('keydown', function esc(e) { if(e.key === 'Escape') { ov.remove(); document.removeEventListener('keydown', esc); } });
  document.body.appendChild(ov);
}

// Beim Start: Link mit Schaltung öffnen
async function loadFromHash() {
  const m = /^#p=(.+)$/.exec(location.hash);
  if(!m) return false;
  try {
    const data = await decodeProject(m[1]);
    const busy = state.components.length || state.wires.length || state.labels.length;
    if(busy && !confirm('Geteilte Schaltung öffnen? Die aktuelle Zeichnung wird ersetzt (sie lässt sich mit „Rückgängig“ zurückholen).')) return false;
    loadData(data);
    zoomFit();
    pushHistory();
    showToast('Geteilte Schaltung geöffnet');
    return true;
  } catch(e) {
    showToast('Der Link enthält keine gültige Schaltung');
    return false;
  } finally {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

// ============================================================
// SIMULATION (Gleichstrom, stationärer Zustand)
// ============================================================
// Knotenpotenzialverfahren mit Ersatzquellen (Spannungsquelle + Innenwiderstand).
// Dioden/LEDs/Z-Dioden, Transistoren (als Schalter) und Relais werden iterativ bestimmt.
// Kondensatoren gelten als geladen (offen), Spulen als Leitung. Wechselspannung, Trafo,
// Operationsverstärker und Gatter werden nicht simuliert.

const SI = { p: 1e-12, n: 1e-9, u: 1e-6, 'µ': 1e-6, 'μ': 1e-6, m: 1e-3, '': 1, k: 1e3, K: 1e3, M: 1e6 };

// Liest eine Größe aus dem Wertefeld, z. B. „4,5 V“, „10 kΩ“, „3,5 V; 0,2 A“
function parseQty(value, unit) {
  const s = latexToUnicode(value || '').replace(/Ohm/gi, 'Ω');
  const re = /(\d+(?:[.,]\d+)?)\s*([pnuµμmkKM]?)\s*(V|A|W|Ω)?/g;
  let m, bare = null;
  while((m = re.exec(s))) {
    const v = parseFloat(m[1].replace(',', '.')) * SI[m[2]];
    if(m[3] === unit) return v;
    if(!m[3] && bare === null) bare = v;
  }
  return unit === 'Ω' ? bare : null;
}

function fmtQty(v, unit) {
  const a = Math.abs(v);
  let [f, p] = a < 1e-9 ? [1, ''] : a < 1e-3 ? [1e6, 'µ'] : a < 1 ? [1e3, 'm'] : a >= 1e6 ? [1e-6, 'M'] : a >= 1e3 ? [1e-3, 'k'] : [1, ''];
  const n = a < 1e-9 ? 0 : v * f;
  return n.toLocaleString('de-DE', { maximumSignificantDigits: 3 }) + ' ' + p + unit;
}

// Netze: Leitungen, Anschlüsse auf Leitungen (T-Stück) und Kreuzungen mit Verbindungspunkt
function buildNets() {
  const parent = new Map();
  const key = p => Math.round(p.x) + ',' + Math.round(p.y);
  const find = k => {
    if(!parent.has(k)) parent.set(k, k);
    let r = k;
    while(parent.get(r) !== r) r = parent.get(r);
    while(parent.get(k) !== r) { const n = parent.get(k); parent.set(k, r); k = n; }
    return r;
  };
  const union = (a, b) => { const ra = find(a), rb = find(b); if(ra !== rb) parent.set(ra, rb); };
  const jAt = new Map(state.junctions.map(j => [jKey(j), j]));
  const segs = [], pts = [];
  for(const w of state.wires) {
    for(let i = 0; i < w.points.length - 1; i++) { union(key(w.points[i]), key(w.points[i + 1])); segs.push([w.points[i], w.points[i + 1]]); }
    pts.push(...w.points);
  }
  for(const c of state.components) C[c.type].pins.forEach((_, i) => { const p = pinWorld(c, i); pts.push(p); find(key(p)); });
  for(const p of pts) {
    const j = jAt.get(key(p));
    if(j && j.disconnected) continue;
    for(const [a, b] of segs) if(onSegment(p, a, b)) union(key(p), key(a));
  }
  for(let i = 0; i < segs.length; i++) for(let k = i + 1; k < segs.length; k++) {
    const x = segIntersect(segs[i][0], segs[i][1], segs[k][0], segs[k][1]);
    if(!x) continue;
    const j = jAt.get(key(x));
    if(j && !j.disconnected && !j.removed) union(key(segs[i][0]), key(segs[k][0]));
  }
  return p => find(key(p));
}

// Lineares Gleichungssystem (Gauß mit Spaltenpivot)
function solveLinear(A, b) {
  const n = b.length;
  for(let i = 0; i < n; i++) {
    let p = i;
    for(let r = i + 1; r < n; r++) if(Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    const d = A[i][i];
    if(Math.abs(d) < 1e-30) continue;
    for(let r = i + 1; r < n; r++) {
      const f = A[r][i] / d;
      if(!f) continue;
      for(let k = i; k < n; k++) A[r][k] -= f * A[i][k];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n).fill(0);
  for(let i = n - 1; i >= 0; i--) {
    let s = b[i];
    for(let k = i + 1; k < n; k++) s -= A[i][k] * x[k];
    x[i] = Math.abs(A[i][i]) < 1e-30 ? 0 : s / A[i][i];
  }
  return x;
}

const SIM_UNSUPPORTED = { ac_source: 'Wechselspannungsquelle', transformer: 'Trafo', transformer_air: 'Trafo', opamp: 'Operationsverstärker', and_gate: 'Logikgatter', or_gate: 'Logikgatter', not_gate: 'Logikgatter' };
const OPEN = 1e-9;

function simulate() {
  const netOf = buildNets();
  const idx = new Map();
  const node = p => { const k = netOf(p); if(!idx.has(k)) idx.set(k, idx.size); return idx.get(k); };
  const comps = state.components.filter(c => C[c.type]);
  const pinNodes = new Map(comps.map(c => [c.id, C[c.type].pins.map((_, i) => node(pinWorld(c, i)))]));
  const P = c => pinNodes.get(c.id);
  const notes = new Set();

  // Bezugspunkt: Erde/Masse, sonst Minuspol der ersten Quelle
  const sources = { battery: [4.5, 0.3], dc_source: [6, 0.05], psu: [12, 0.05], solar: [0.5, 2] };
  let ground = null;
  for(const c of comps) if(c.type === 'gnd' || c.type === 'chassis') { ground = ground ?? P(c)[0]; }
  if(ground === null) { const s = comps.find(c => sources[c.type]); ground = s ? P(s)[1] : 0; }
  // Alle Erde/Masse-Anschlüsse liegen auf demselben Bezugspotenzial
  const groundNets = new Set(comps.filter(c => c.type === 'gnd' || c.type === 'chassis').map(c => P(c)[0]));

  // Modelle
  const R = [], V = [], D = [], Q = [], relays = [];
  const res = (c, a, b, ohm, tag) => R.push({ c, a, b, g: 1 / Math.max(ohm, 1e-6), tag });
  const lampNom = c => {
    const u = parseQty(c.value, 'V') ?? 6, i = parseQty(c.value, 'A'), w = parseQty(c.value, 'W');
    const inom = i ?? (w ? w / u : 0.1);
    return { u, i: inom, r: u / inom, p: u * inom };
  };
  for(const c of comps) {
    const n = P(c), v = c.value;
    if(SIM_UNSUPPORTED[c.type]) { notes.add(`${SIM_UNSUPPORTED[c.type]} wird nicht simuliert`); continue; }
    switch(c.type) {
      case 'resistor': res(c, n[0], n[1], parseQty(v, 'Ω') ?? 100); break;
      case 'potentiometer': { const r = parseQty(v, 'Ω') ?? 1000; res(c, n[0], n[2], r / 2); res(c, n[2], n[1], r / 2); break; }
      case 'ldr': res(c, n[0], n[1], c.dark ? 100e3 : (parseQty(v, 'Ω') ?? 1000)); break;
      case 'ntc': { const r = parseQty(v, 'Ω') ?? 10e3; res(c, n[0], n[1], c.hot ? r / 10 : r); break; }
      case 'fuse': if(!state.simBlown.has(c.id)) res(c, n[0], n[1], 0.05); break;
      case 'inductor': case 'inductor_core': res(c, n[0], n[1], parseQty(v, 'Ω') ?? 0.1); break;
      case 'capacitor': case 'polarized_capacitor': notes.add('Kondensatoren: Endzustand (geladen)'); break;
      case 'lamp': res(c, n[0], n[1], lampNom(c).r); break;
      case 'motor': res(c, n[0], n[1], parseQty(v, 'Ω') ?? 10); break;
      case 'bell': res(c, n[0], n[1], parseQty(v, 'Ω') ?? 20); break;
      case 'speaker': res(c, n[0], n[1], parseQty(v, 'Ω') ?? 8); break;
      case 'meter': res(c, n[0], n[1], 10e6); break;
      case 'ammeter': res(c, n[0], n[1], 0.01); break;
      case 'iarrow': res(c, n[0], n[1], 1e-3); break;
      case 'switch': if(c.closed) res(c, n[0], n[1], 1e-3); break;
      case 'button': if(c.closed || state.simPressed.has(c.id)) res(c, n[0], n[1], 1e-3); break;
      case 'switch2': res(c, n[0], n[c.pos ? 2 : 1], 1e-3); break;
      case 'relay': res(c, n[0], n[1], parseQty(v, 'Ω') ?? 100, 'coil'); relays.push({ c, on: false }); break;
      case 'diode': D.push({ c, a: n[0], k: n[1], vf: 0.7, rd: 0.5, st: 'off' }); break;
      case 'led': D.push({ c, a: n[0], k: n[1], vf: 2.0, rd: 10, st: 'off' }); break;
      case 'zener': D.push({ c, a: n[0], k: n[1], vf: 0.7, rd: 0.5, vz: parseQty(v, 'V') ?? 5.1, st: 'off' }); break;
      case 'npn': case 'pnp': Q.push({ c, b: n[0], col: n[1], e: n[2], pnp: c.type === 'pnp', be: 'off', ce: false }); notes.add('Transistoren werden als Schalter simuliert'); break;
      default:
        if(sources[c.type]) {
          const [u0, r0] = sources[c.type];
          V.push({ c, p: n[0], m: n[1], u: parseQty(v, 'V') ?? u0, r: parseQty(v, 'Ω') ?? r0 });
        }
    }
  }
  if(!V.length) return { notes: ['Keine Gleichspannungsquelle im Schaltplan', ...notes], comps: new Map() };

  const N = idx.size;
  let x = new Array(N).fill(0);
  const pot = k => (groundNets.has(k) || k === ground) ? 0 : x[k];
  const solve = () => {
    const A = Array.from({ length: N }, () => new Array(N).fill(0)), b = new Array(N).fill(0);
    const G = (a, c, g) => { A[a][a] += g; A[c][c] += g; A[a][c] -= g; A[c][a] -= g; };
    const I = (a, i) => { b[a] += i; };              // eingespeister Strom in Knoten a
    for(const r of R) G(r.a, r.b, r.g);
    for(const s of V) { const g = 1 / s.r; G(s.p, s.m, g); I(s.p, s.u * g); I(s.m, -s.u * g); }
    for(const d of D) {
      if(d.st === 'on') { const g = 1 / d.rd; G(d.a, d.k, g); I(d.a, g * d.vf); I(d.k, -g * d.vf); }
      else if(d.st === 'z') { const g = 1 / 2; G(d.a, d.k, g); I(d.k, g * d.vz); I(d.a, -g * d.vz); }
      else G(d.a, d.k, OPEN);
    }
    for(const q of Q) {
      const [an, ka] = q.pnp ? [q.e, q.b] : [q.b, q.e];
      if(q.be === 'on') { const g = 1 / 50; G(an, ka, g); I(an, g * 0.7); I(ka, -g * 0.7); } else G(an, ka, OPEN);
      G(q.col, q.e, q.ce ? 1 / 0.3 : OPEN);
    }
    for(const rl of relays) if(rl.on) { const n = P(rl.c); G(n[2], n[3], 1e3); }
    // Bezug festlegen, Leckleitwert gegen schwebende Netze
    const fixed = new Set([ground, ...groundNets]);
    for(let i = 0; i < N; i++) {
      A[i][i] += 1e-9;
      if(fixed.has(i)) { A[i].fill(0); A[i][i] = 1; b[i] = 0; }
    }
    x = solveLinear(A, b);
  };

  // Zustände iterieren, bis sie sich nicht mehr ändern
  let iter = 0, changed = true;
  while(changed && iter++ < 60) {
    solve();
    changed = false;
    for(const d of D) {
      const u = pot(d.a) - pot(d.k);
      let st = d.st;
      if(d.st === 'off') st = u > d.vf ? 'on' : (d.vz && -u > d.vz ? 'z' : 'off');
      else if(d.st === 'on') st = (u - d.vf) / d.rd < 0 ? 'off' : 'on';
      else st = (-u - d.vz) / 2 < 0 ? 'off' : 'z';
      if(st !== d.st) { d.st = st; changed = true; }
    }
    for(const q of Q) {
      const [an, ka] = q.pnp ? [q.e, q.b] : [q.b, q.e];
      const u = pot(an) - pot(ka);
      const be = q.be === 'off' ? (u > 0.7 ? 'on' : 'off') : ((u - 0.7) / 50 < 0 ? 'off' : 'on');
      q.ib = be === 'on' ? Math.max(0, (u - 0.7) / 50) : 0;
      const ce = be === 'on' && q.ib > 2e-5;
      if(be !== q.be || ce !== q.ce) { q.be = be; q.ce = ce; changed = true; }
    }
    for(const rl of relays) {
      const coil = R.find(r => r.c === rl.c && r.tag === 'coil');
      const on = Math.abs((pot(coil.a) - pot(coil.b)) * coil.g) > (parseQty(rl.c.value, 'A') ?? 0.02);
      if(on !== rl.on) { rl.on = on; changed = true; }
    }
  }
  if(iter >= 60) notes.add('Die Simulation hat keinen stabilen Zustand gefunden');

  // Ergebnisse je Bauteil
  const out = new Map();
  const curOf = c => { const r = R.find(e => e.c === c); return r ? (pot(r.a) - pot(r.b)) * r.g : 0; };
  for(const c of comps) {
    const n = P(c), o = {};
    switch(c.type) {
      case 'meter': o.text = fmtQty(pot(n[0]) - pot(n[1]), 'V'); break;
      case 'ammeter': case 'iarrow': o.text = fmtQty(curOf(c), 'A'); break;
      case 'lamp': {
        const nom = lampNom(c), i = Math.abs(curOf(c)), p = i * i * nom.r;
        o.glow = Math.min(1, p / nom.p);
        if(p > 2 * nom.p) o.warn = 'Lampe überlastet';
        break;
      }
      case 'led': {
        const d = D.find(e => e.c === c), i = d.st === 'on' ? (pot(d.a) - pot(d.k) - d.vf) / d.rd : 0;
        o.glow = Math.min(1, i / 0.01);
        if(i > 0.03) o.warn = `LED überlastet (${fmtQty(i, 'A')}) – Vorwiderstand?`;
        break;
      }
      case 'motor': if(Math.abs(curOf(c)) > 0.02) o.text = '↻ läuft'; break;
      case 'bell': if(Math.abs(curOf(c)) > 0.01) o.text = '♪ klingelt'; break;
      case 'speaker': if(Math.abs(curOf(c)) > 0.01) o.text = '♪'; break;
      case 'ldr': o.text = c.dark ? 'dunkel' : 'hell'; break;
      case 'ntc': o.text = c.hot ? 'warm' : 'kalt'; break;
      case 'fuse': {
        if(state.simBlown.has(c.id)) { o.warn = 'Sicherung ausgelöst – antippen zum Ersetzen'; break; }
        if(Math.abs(curOf(c)) > (parseQty(c.value, 'A') ?? 1)) { state.simBlown.add(c.id); return simulate(); }
        break;
      }
      case 'relay': if(relays.find(r => r.c === c).on) o.over = { closed: true }; break;
      case 'button': if(state.simPressed.has(c.id)) o.over = { closed: true }; break;
      default:
        if(sources[c.type]) {
          const s = V.find(e => e.c === c), i = (s.u - (pot(s.p) - pot(s.m))) / s.r;
          if(i > 0.8 * s.u / s.r) o.warn = 'Kurzschluss!';
          else if(i < -1e-6 && c.type !== 'solar') o.text = 'wird geladen';
        }
    }
    if(Object.keys(o).length) out.set(c.id, o);
  }
  return { notes: [...notes], comps: out };
}

// ---------- Darstellung ----------

function toggleSim(on = !state.sim) {
  state.sim = on;
  state.simPressed = new Set();
  state.simBlown = new Set();
  if(on) { setTool('select'); clearSelection(); }
  $('btn-sim').classList.toggle('active', on);
  runSim();
  updateHint();
}

function runSim() {
  const under = $('sim-under'), over = $('sim-over');
  under.innerHTML = ''; over.innerHTML = '';
  if(!state.sim) { state.simResult = null; state.components.forEach(c => { if(c._sim) { delete c._sim; renderComp(c); } }); return; }
  const r = simulate();
  state.simResult = r;
  for(const c of state.components) {
    const o = r.comps.get(c.id) || {};
    // Zustände, die nur in der Simulation gelten (z. B. angezogenes Relais), ohne das Bauteil zu ändern
    const prev = JSON.stringify(c._sim || null), next = o.over ? JSON.stringify(o.over) : 'null';
    if(prev !== next) { if(o.over) c._sim = o.over; else delete c._sim; renderComp(c); }
    const def = C[c.type], a = c.angle || 0;
    const hh = (a % 180 ? def.w : def.h) / 2;
    if(o.glow > 0.02) {
      if(c.type === 'lamp') el('circle', { cx: c.x, cy: c.y, r: 20, fill: '#facc15', opacity: (0.25 + 0.75 * o.glow).toFixed(2) }, under);
      else el('polygon', { points: '14,0 -14,-16 -14,16', fill: '#ef4444', opacity: (0.3 + 0.7 * o.glow).toFixed(2), transform: `translate(${c.x},${c.y}) rotate(${a})` }, under);
    }
    const badge = (txt, warn) => {
      const g = el('g', { transform: `translate(${c.x},${c.y - hh - 12})` }, over);
      const w = txt.length * 6.2 + 12;
      el('rect', { x: -w / 2, y: -10, width: w, height: 17, rx: 8.5, fill: warn ? '#dc2626' : '#1e1e2e', opacity: .9 }, g);
      const t = el('text', { x: 0, y: 2.5, 'text-anchor': 'middle', 'font-size': 10.5, 'font-family': 'Inter,sans-serif', fill: '#fff', 'font-weight': 600 }, g);
      t.textContent = txt;
    };
    if(o.warn) badge(o.warn, true);
    else if(o.text) badge(o.text, false);
  }
  updateHint();
}

// Antippen in der Simulation: Schalter umlegen, Taster drücken, LDR/NTC umschalten, Sicherung ersetzen
function simInteract(comp, e) {
  const t = comp.type;
  if(t === 'button') {
    state.simPressed.add(comp.id); runSim();
    track(null, () => { state.simPressed.delete(comp.id); runSim(); }, e.pointerId);
    return true;
  }
  if(t === 'switch') comp.closed = !comp.closed;
  else if(t === 'switch2') comp.pos = comp.pos ? 0 : 1;
  else if(t === 'ldr') comp.dark = !comp.dark;
  else if(t === 'ntc') comp.hot = !comp.hot;
  else if(t === 'fuse' && state.simBlown.has(comp.id)) state.simBlown.delete(comp.id);
  else return false;
  renderComp(comp);
  pushHistory();
  return true;
}

function contentBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const ext = (x1, y1, x2, y2) => { minX = Math.min(minX, x1); minY = Math.min(minY, y1); maxX = Math.max(maxX, x2); maxY = Math.max(maxY, y2); };
  for(const c of state.components) {
    const d = C[c.type]; if(!d) continue;
    const r = Math.max(d.w, d.h) / 2 + 4;
    ext(c.x - r, c.y - r, c.x + r, c.y + r);
    const lo = c.labelOff || { x: 0, y: 32 };
    const w = Math.max(String(c.label).length, String(c.value).length) * 3.5 + 4;
    ext(c.x + lo.x - w, c.y + lo.y, c.x + lo.x + w, c.y + lo.y + (c.value ? 28 : 14));
  }
  for(const w of state.wires) for(const p of w.points) ext(p.x - 4, p.y - 4, p.x + 4, p.y + 4);
  for(const l of state.labels) {
    const lines = String(l.text).split('\n');
    const longest = Math.max(...lines.map(t => t.length));
    ext(l.x - 2, l.y - l.size, l.x + longest * l.size * 0.6 + 4, l.y + (lines.length - 1) * l.size * 1.2 + 4);
  }
  if(!isFinite(minX)) return { x: 0, y: 0, w: 200, h: 200 };
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

function getBounds() {
  if(state.selRect) {
    const pad = 4;
    return { x: state.selRect.x - pad, y: state.selRect.y - pad, w: state.selRect.w + pad * 2, h: state.selRect.h + pad * 2 };
  }
  const b = contentBounds(), pad = 16;
  return { x: b.x - pad, y: b.y - pad, w: b.w + pad * 2, h: b.h + pad * 2 + 14 };
}

function rectGesture(e) {
  const s = getSnappedPos(e);
  const rect = $('selection-rect');
  const show = r => {
    rect.style.display = r ? 'block' : 'none';
    if(r) { rect.setAttribute('x', r.x); rect.setAttribute('y', r.y); rect.setAttribute('width', r.w); rect.setAttribute('height', r.h); }
  };
  const box = p => ({ x: Math.min(s.x, p.x), y: Math.min(s.y, p.y), w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y) });
  show(box(s));
  track(ev => show(box(getSnappedPos(ev))), (ev, cancelled) => {
    const b = cancelled ? null : box(getSnappedPos(ev));
    if(b && b.w > 8 && b.h > 8) {
      state.selRect = b;
      showToast(`Bereich ${Math.round(b.w)}×${Math.round(b.h)} gesetzt – SVG/TikZ exportiert nur diesen Ausschnitt`);
    } else show(state.selRect);
    if(!cancelled) setTool('select');
  }, e.pointerId);
}

function clearArea() {
  state.selRect = null;
  $('selection-rect').style.display = 'none';
  showToast('Bereichsauswahl aufgehoben');
}
window.clearArea = clearArea;

const SIGNATURE = 'Vectronix by Tobias Schmidbauer';

// Export-Einstellungen bleiben im Browser gespeichert
const EXPORT_KEY = 'vectronix-export-v1';
function exportSettings() {
  const d = { format: 'png', task: false, signature: true, dpi: 300, transparent: false };
  try { return { ...d, ...JSON.parse(localStorage.getItem(EXPORT_KEY) || '{}') }; } catch(e) { return d; }
}
function saveExportSettings(o) { try { localStorage.setItem(EXPORT_KEY, JSON.stringify(o)); } catch(e) {} }

const hasBlanks = () => state.components.some(c => c.blank) || state.wires.some(w => w.blank);

// Lücke für Arbeitsblätter: Rahmen über die Anschlüsse des Bauteils (Leitungen enden am Rahmen)
function blankBox(c) {
  const def = C[c.type];
  let x1, y1, x2, y2;
  if(def.pins.length >= 2) {
    const xs = def.pins.map(p => p.x), ys = def.pins.map(p => p.y);
    x1 = Math.min(...xs); x2 = Math.max(...xs); y1 = Math.min(...ys); y2 = Math.max(...ys);
    if(x2 - x1 < 24) { const m = (x1 + x2) / 2; x1 = m - 12; x2 = m + 12; }
    if(y2 - y1 < 24) { const m = (y1 + y2) / 2; y1 = m - 12; y2 = m + 12; }
  } else { x1 = -def.w / 2; x2 = def.w / 2; y1 = -def.h / 2; y2 = def.h / 2; }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

// Erzeugt das Export-SVG. task = Aufgabenfassung (Lücken leer), signature = Signatur unten links
function buildSVG(o = {}) {
  const b = getBounds();
  const r = v => Math.round(v * 100) / 100;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${r(b.w)}" height="${r(b.h)}" viewBox="${r(b.x)} ${r(b.y)} ${r(b.w)} ${r(b.h)}" font-family="Inter,Arial,sans-serif">\n`;
  svg += `<clipPath id="crop"><rect x="${r(b.x)}" y="${r(b.y)}" width="${r(b.w)}" height="${r(b.h)}"/></clipPath><g clip-path="url(#crop)">\n`;
  if(o.background) svg += `<rect x="${r(b.x)}" y="${r(b.y)}" width="${r(b.w)}" height="${r(b.h)}" fill="${o.background}"/>\n`;

  for(const w of state.wires) {
    if(o.task && w.blank) continue;
    const pts = w.points;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
    svg += `<path d="${d}" fill="none" stroke="#000" stroke-width="1" stroke-linejoin="round"/>\n`;
  }
  for(const c of state.components) {
    if(!C[c.type]) continue;
    const rotAttr = c.angle ? ` transform="rotate(${c.angle})"` : '';
    if(o.task && c.blank) {
      const bb = blankBox(c);
      svg += `<g transform="translate(${c.x},${c.y})"><g${rotAttr}><rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="#fff" stroke="#000" stroke-width="1"/></g></g>\n`;
    } else {
      svg += `<g transform="translate(${c.x},${c.y})"><g${rotAttr}>${compBodySVG(c)}</g>${compLabelSVG(c).replace(' style="cursor:move"', '')}</g>\n`;
    }
  }
  for(const j of state.junctions) {
    if(j.removed) continue;
    if(j.disconnected) svg += `<path d="M ${j.x - 5} ${j.y - 3} Q ${j.x} ${j.y + 5} ${j.x + 5} ${j.y - 3}" fill="none" stroke="#dc2626" stroke-width="1"/>\n`;
    else svg += `<circle cx="${j.x}" cy="${j.y}" r="3" fill="#000"/>\n`;
  }
  for(const l of state.labels) svg += `<g transform="translate(${l.x},${l.y})">${textSVG(l)}</g>\n`;

  if(o.signature !== false) svg += `<text x="${r(b.x + 6)}" y="${r(b.y + b.h - 6)}" font-family="'Old Standard TT','Times New Roman',Georgia,serif" font-style="italic" font-size="10" fill="#000">${escapeXml(SIGNATURE)}</text>\n`;
  svg += '</g>\n</svg>\n';
  return { svg, b };
}

// ---------- PNG ----------

// CRC32 für den pHYs-Block (damit Word & Co. die Druckauflösung kennen)
const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++) { let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xffffffff; for(const b of bytes) c = CRC_TABLE[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

async function pngWithDpi(blob, dpi) {
  const src = new Uint8Array(await blob.arrayBuffer());
  const ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9);
  chunk.set([0x70, 0x48, 0x59, 0x73], 4);           // "pHYs"
  dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
  dv.setUint32(17, crc32(chunk.subarray(4, 17)));
  const at = 33;                                      // Signatur (8) + IHDR (25)
  const out = new Uint8Array(src.length + chunk.length);
  out.set(src.subarray(0, at)); out.set(chunk, at); out.set(src.subarray(at), at + chunk.length);
  return new Blob([out], { type: 'image/png' });
}

async function buildPNG(o) {
  const { svg, b } = buildSVG({ ...o, background: o.transparent ? null : '#fff' });
  const scale = (o.dpi || 300) / 96;
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Bild konnte nicht erzeugt werden')); img.src = url; });
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(b.w * scale); cv.height = Math.ceil(b.h * scale);
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    return { blob: await pngWithDpi(blob, o.dpi || 300), w: cv.width, h: cv.height };
  } finally { URL.revokeObjectURL(url); }
}

async function downloadPNG(o) {
  try {
    const { blob, w, h } = await buildPNG(o);
    downloadBlob(blob, o.task ? 'schaltplan-aufgabe.png' : 'schaltplan.png');
    showToast(`PNG gespeichert (${w}×${h} px, ${o.dpi} dpi)`);
  } catch(e) { showToast('PNG-Export fehlgeschlagen: ' + e.message); }
}

// Bild in die Zwischenablage – zum Einfügen in Word, OneNote, PowerPoint …
function copyImage(o = exportSettings()) {
  if(!navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
    showToast('Dieser Browser kann keine Bilder kopieren – bitte als PNG herunterladen');
    return;
  }
  // Safari verlangt das Promise direkt im Klick-Ereignis
  const blob = buildPNG({ ...o, transparent: false }).then(r => r.blob);
  navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
    .then(() => showToast('Bild kopiert – jetzt z. B. in Word einfügen'), e => showToast('Kopieren nicht möglich: ' + e.message));
}

function exportSVG(o = exportSettings()) {
  const { svg, b } = buildSVG(o);
  download(svg, o.task ? 'schaltplan-aufgabe.svg' : 'schaltplan.svg', 'image/svg+xml');
  showToast('SVG exportiert (' + Math.round(b.w) + '×' + Math.round(b.h) + ' px)');
}

// ============================================================
// EXPORT LaTeX (circuitikz)
// ============================================================

function texText(s) {
  s = String(s);
  if(s.includes('$')) return s;
  return s.replace(/[\\&%#_{}~^]/g, m => ({ '\\':'\\textbackslash{}', '~':'\\textasciitilde{}', '^':'\\textasciicircum{}' }[m] || '\\' + m))
          .replace(/Ω/g, '$\\Omega$').replace(/[µμ]/g, '$\\mu$');
}

const TIKZ_BIPOLE = {
  resistor:'R', capacitor:'C', polarized_capacitor:'eC', inductor:'L', diode:'D', led:'leD',
  battery:'battery1', dc_source:'V', ac_source:'sV', lamp:'lamp', fuse:'fuse',
  meter:'voltmeter', ammeter:'ammeter'
};

// Zeichen aus Symbol-Texten nach LaTeX
const TEX_SYM = { '+': '$+$', '−': '$-$', '∞': '$\\infty$', '&': '\\&', '≥1': '$\\geq 1$', '1': '1', '−ϑ': '$-\\vartheta$', 'M': 'M', 'V': 'V', 'A': 'A' };

// Bauteile ohne passendes circuitikz-Symbol: Linien, Rechtecke, Kreise, Polygone, Halbkreisbögen
// und Texte des Symbols werden 1:1 als TikZ-Befehle ausgegeben (inkl. Drehung).
function symbolToTikz(c, P) {
  const doc = new DOMParser().parseFromString(`<svg xmlns="${SVG_NS}">${compBodySVG(c)}</svg>`, 'image/svg+xml');
  const T = (x, y) => { const q = rot(+x, +y, c.angle); return { x: c.x + q.x, y: c.y + q.y }; };
  const out = [];
  const style = e => {
    const st = [];
    const sw = +(e.getAttribute('stroke-width') || 1);
    if(sw >= 1.5) st.push(`line width=${(sw * 0.4).toFixed(2)}pt`);
    if(e.getAttribute('stroke-dasharray')) st.push('densely dashed');
    return st.length ? `[${st.join(', ')}]` : '';
  };
  for(const e of doc.documentElement.children) {
    const a = n => e.getAttribute(n);
    const filled = a('fill') === '#000';
    switch(e.tagName) {
      case 'line': out.push(`\\draw${style(e)} ${P(T(a('x1'), a('y1')))} -- ${P(T(a('x2'), a('y2')))};`); break;
      case 'rect': {
        const x = +a('x'), y = +a('y'), w = +a('width'), h = +a('height');
        const pts = [T(x, y), T(x + w, y), T(x + w, y + h), T(x, y + h)].map(P).join(' -- ');
        out.push(`\\${filled ? 'fill' : 'draw'}${style(e)} ${pts} -- cycle;`); break;
      }
      case 'circle': out.push(`\\${filled ? 'fill' : 'draw'} ${P(T(a('cx'), a('cy')))} circle (${(+a('r') / 32).toFixed(3)});`); break;
      case 'polygon': {
        const nums = a('points').trim().split(/[\s,]+/).map(Number), pts = [];
        for(let i = 0; i < nums.length; i += 2) pts.push(P(T(nums[i], nums[i + 1])));
        out.push(`\\${filled ? 'fill' : 'draw'}${style(e)} ${pts.join(' -- ')} -- cycle;`); break;
      }
      case 'path': {
        // Unterstützt M L H V Z und A (Halbkreise); absolute Koordinaten
        const toks = a('d').match(/[MLHVZA]|-?\d*\.?\d+/gi);
        let i = 0, cmd = '', cur = { x: 0, y: 0 }, startPt = null, seg = '';
        const num = () => +toks[i++];
        while(i < toks.length) {
          if(/[A-Za-z]/.test(toks[i])) cmd = toks[i++].toUpperCase();
          if(cmd === 'M') { cur = { x: num(), y: num() }; startPt = cur; seg += ` ${P(T(cur.x, cur.y))}`; cmd = 'L'; }
          else if(cmd === 'L') { cur = { x: num(), y: num() }; seg += ` -- ${P(T(cur.x, cur.y))}`; }
          else if(cmd === 'H') { cur = { x: num(), y: cur.y }; seg += ` -- ${P(T(cur.x, cur.y))}`; }
          else if(cmd === 'V') { cur = { x: cur.x, y: num() }; seg += ` -- ${P(T(cur.x, cur.y))}`; }
          else if(cmd === 'Z') { seg += ' -- cycle'; cur = startPt; }
          else if(cmd === 'A') {
            const rr = num(); num(); num(); num(); const sweep = num(); const nx = num(), ny = num();
            const p0 = T(cur.x, cur.y), p1 = T(nx, ny), m = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
            const a0 = Math.round(Math.atan2(-(p0.y - m.y), p0.x - m.x) * 180 / Math.PI);
            seg += ` arc[start angle=${a0}, end angle=${sweep ? a0 - 180 : a0 + 180}, radius=${(rr / 32).toFixed(3)}]`;
            cur = { x: nx, y: ny };
          } else break;
        }
        out.push(`\\draw${style(e)}${seg};`); break;
      }
      case 'text': {
        const t = e.textContent.trim();
        if(!t) break;
        const fs = +(a('font-size') || 10);
        out.push(`\\node[inner sep=0, font=${fs >= 20 ? '\\Large' : fs >= 13 ? '\\normalsize' : '\\scriptsize'}] at ${P(T(a('x'), a('y')))} {${TEX_SYM[t] || texText(t)}};`); break;
      }
    }
  }
  return out.join('\n') + '\n';
}

function exportTikZ(o = exportSettings()) {
  const S = 32; // 32 Einheiten der Zeichenfläche = 1 TikZ-Einheit
  const f = v => +(v / S).toFixed(3);
  const P = p => `(${f(p.x)},${f(-p.y)})`;
  const b = getBounds();
  // Objekte, die den Bereich berühren; der Rest wird per \clip abgeschnitten
  const hits = (x1, y1, x2, y2) => x2 >= b.x && x1 <= b.x + b.w && y2 >= b.y && y1 <= b.y + b.h;
  const inside = (x, y) => hits(x, y, x, y);

  let t = `% Vectronix – Schaltplan (DIN EN 60617)${o.task ? ' – Aufgabenfassung' : ''}
% Benötigt das Paket circuitikz. 32 Einheiten der Zeichenfläche = 1 TikZ-Einheit.
\\documentclass[border=2mm]{standalone}
\\usepackage[european]{circuitikz}
\\ctikzset{logic ports=european}

\\begin{document}
\\begin{circuitikz}[every node/.style={font=\\small}]
\\useasboundingbox ${P({ x: b.x, y: b.y })} rectangle ${P({ x: b.x + b.w, y: b.y + b.h })};
\\begin{scope}
\\clip ${P({ x: b.x, y: b.y })} rectangle ${P({ x: b.x + b.w, y: b.y + b.h })};
`;

  state.components.forEach((c, n) => {
    const def = C[c.type];
    if(!def) return;
    const r = Math.max(def.w, def.h) / 2 + 4;
    if(!hits(c.x - r, c.y - r, c.x + r, c.y + r)) return;
    const name = 'c' + n;
    const pw = i => P(pinWorld(c, i));
    const lbl = texText(latexToTexKeep(c.label));
    const val = c.value ? texText(c.value) : '';
    const opts = `l={${lbl}}` + (val ? `, a={${val}}` : '');
    const rotOpt = c.angle ? `, rotate=${-c.angle}` : '';
    const center = P(c);
    const lo = c.labelOff || { x: 0, y: 32 };
    const labelNode = `\\node[align=center] at ${P({ x: c.x + lo.x, y: c.y + lo.y + 8 })} {${lbl}${val ? `\\\\${val}` : ''}};`;
    t += `% ${def.name} ${c.label}\n`;

    if(o.task && c.blank) {
      const bb = blankBox(c);
      const pts = [[bb.x, bb.y], [bb.x + bb.w, bb.y], [bb.x + bb.w, bb.y + bb.h], [bb.x, bb.y + bb.h]]
        .map(([x, y]) => { const q = rot(x, y, c.angle); return P({ x: c.x + q.x, y: c.y + q.y }); });
      t += `\\draw[fill=white] ${pts.join(' -- ')} -- cycle;\n`;
    } else if(TIKZ_BIPOLE[c.type]) {
      t += `\\draw ${pw(0)} to[${TIKZ_BIPOLE[c.type]}, ${opts}] ${pw(1)};\n`;
    } else switch(c.type) {
      case 'potentiometer':
        t += `\\draw ${pw(0)} to[pR, ${opts}, name=${name}] ${pw(1)};\n\\draw (${name}.wiper) -- ${pw(2)};\n`; break;
      case 'gnd':
        t += `\\node[ground${rotOpt}] at ${pw(0)} {};\n`; break;
      case 'chassis':
        t += `\\node[cground${rotOpt}] at ${pw(0)} {};\n`; break;
      case 'motor':
        t += `\\node[draw, circle, inner sep=2pt, minimum size=1.5cm] (${name}) at ${center} {M};\n\\draw ${pw(0)} -- (${name}) ${pw(1)} -- (${name});\n${labelNode}\n`; break;
      case 'transformer':
      case 'transformer_air':
        t += `\\node[${c.type === 'transformer' ? 'transformer core' : 'transformer'}${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.A1) -- ${pw(0)}; \\draw (${name}.A2) -- ${pw(1)}; \\draw (${name}.B1) -- ${pw(2)}; \\draw (${name}.B2) -- ${pw(3)};\n${labelNode}\n`; break;
      case 'opamp':
        t += `\\node[en amp${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.+) -- ${pw(0)}; \\draw (${name}.-) -- ${pw(1)}; \\draw (${name}.out) -- ${pw(2)};\n${labelNode}\n`; break;
      case 'and_gate':
      case 'or_gate':
        t += `\\node[${c.type === 'and_gate' ? 'and' : 'or'} port${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.in 1) -- ${pw(0)}; \\draw (${name}.in 2) -- ${pw(1)}; \\draw (${name}.out) -- ${pw(2)};\n${labelNode}\n`; break;
      case 'not_gate':
        t += `\\node[not port${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.in 1) -- ${pw(0)}; \\draw (${name}.out) -- ${pw(1)};\n${labelNode}\n`; break;
      default:
        t += symbolToTikz(c, P) + labelNode + '\n';
    }
  });

  t += '\n% Leitungen\n';
  for(const w of state.wires) {
    if(o.task && w.blank) continue;
    const xs = w.points.map(p => p.x), ys = w.points.map(p => p.y);
    if(!hits(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys))) continue;
    t += `\\draw ${w.points.map(P).join(' -- ')};\n`;
  }

  t += '\n% Verbindungspunkte\n';
  for(const j of state.junctions) {
    if(j.removed || j.disconnected || !inside(j.x, j.y)) continue;
    t += `\\node[circ] at ${P(j)} {};\n`;
  }

  if(state.labels.some(l => inside(l.x, l.y))) t += '\n% Texte\n';
  for(const l of state.labels) {
    if(!inside(l.x, l.y)) continue;
    t += `\\node[anchor=south west, align=left] at ${P(l)} {${String(l.text).split('\n').map(texText).join('\\\\')}};\n`;
  }

  t += `\\end{scope}\n`;
  if(o.signature !== false) t += `\\node[anchor=south west, inner sep=2pt, font=\\rmfamily\\itshape\\footnotesize] at ${P({ x: b.x, y: b.y + b.h })} {${SIGNATURE}};\n`;
  t += `\\end{circuitikz}\n\\end{document}\n`;
  showTikZDialog(t);
}

let tikzCode = '';

function showTikZDialog(code) {
  tikzCode = code;
  openDialog(`
    <h2>LaTeX-Code (circuitikz)</h2>
    <div class="hint" style="margin:0 0 8px">${state.selRect ? 'Exportiert wird der markierte Bereich.' : 'Exportiert wird der gesamte Schaltplan.'} Benötigt das Paket <code>circuitikz</code>.</div>
    <textarea id="tikz-out" readonly spellcheck="false" style="width:min(760px,80vw);height:min(420px,50vh);font-size:12px;white-space:pre;overflow:auto"></textarea>
    <div class="btns">
      <button onclick="downloadTikZ()">Als .tex speichern</button>
      <button onclick="copyTikZ()" class="primary" id="tikz-copy">📋 Code kopieren</button>
      <button onclick="closeDialog()">Schließen</button>
    </div>`);
  const ta = $('tikz-out');
  ta.value = code;
  ta.focus(); ta.select();
}

function copyTikZ() {
  const ta = $('tikz-out');
  const done = () => { $('tikz-copy').textContent = '✔ Kopiert'; showToast('LaTeX-Code kopiert'); };
  const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy') ? done() : showToast('Bitte mit Strg+C kopieren'); } catch(e) { showToast('Bitte mit Strg+C kopieren'); } };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(tikzCode).then(done, fallback);
  else fallback();
}

function downloadTikZ() { download(tikzCode, 'schaltplan.tex', 'text/plain'); }

// Beschriftungen wie "R_1" bleiben als Mathe-Text erhalten
function latexToTexKeep(s) { return /^[A-Za-z]+_\{?\w+\}?$/.test(s) ? '$' + s + '$' : s; }

// ============================================================
// SPEICHERN / LADEN
// ============================================================

function projectData() {
  return {
    version: 4,
    components: state.components.map(({ _sim, ...c }) => c),
    wires: state.wires.map(w => ({ id: w.id, points: w.points, ...(w.blank ? { blank: true } : {}) })),
    labels: state.labels,
    junctions: state.junctions,
    counter: state.counter,
  };
}

function saveJSON() {
  download(JSON.stringify(projectData(), null, 2), 'schaltplan.vectronix', 'application/json');
  showToast('Projekt gespeichert');
}

const num = v => typeof v === 'number' && isFinite(v);

// Setzt den kompletten Zustand aus Daten (Laden, Undo/Redo, Autosave)
// Bis Version 3 lagen einige Anschlüsse zwischen den Rasterpunkten. Leitungsenden, die an
// einem alten Anschluss hingen, wandern auf die neue Position im 8er-Raster.
const OLD_PINS = {
  capacitor: [[0,-20],[0,20]], polarized_capacitor: [[0,-20],[0,20]],
  diode: [[-28,0],[28,0]], led: [[-28,0],[28,0]], lamp: [[-28,0],[28,0]],
  switch: [[-32,0],[44,0]], battery: [[0,-28],[0,28]], gnd: [[0,-28]],
  transformer: [[-36,-14],[-36,16],[36,-14],[36,16]], transformer_air: [[-36,-14],[-36,16],[36,-14],[36,16]],
  opamp: [[-52,-16],[-52,16],[36,0]], and_gate: [[-40,-12],[-40,12],[40,0]], or_gate: [[-40,-12],[-40,12],[40,0]],
};

function migratePins() {
  for(const c of state.components) {
    const old = OLD_PINS[c.type];
    if(!old) continue;
    old.forEach(([x, y], i) => {
      const r = rot(x, y, c.angle), from = { x: c.x + r.x, y: c.y + r.y }, to = pinWorld(c, i);
      for(const w of state.wires)
        w.points.forEach((p, idx) => {
          if((idx === 0 || idx === w.points.length - 1) && Math.abs(p.x - from.x) <= 2 && Math.abs(p.y - from.y) <= 2)
            moveWirePoint(w, idx, to.x, to.y);
        });
    });
  }
}

function loadData(data) {
  clearAll();
  for(const c of (data.components || [])) {
    if(!c || !C[c.type] || !num(c.x) || !num(c.y)) continue;
    const comp = newComp(c.type, c.x, c.y, {
      id: c.id || genId(), label: String(c.label ?? ''), value: String(c.value ?? ''),
      angle: num(c.angle) ? c.angle : 0, showPolarity: !!c.showPolarity,
      closed: !!c.closed, pos: c.pos ? 1 : 0, blank: !!c.blank, dark: !!c.dark, hot: !!c.hot,
      labelOff: c.labelOff && num(c.labelOff.x) && num(c.labelOff.y) ? { x: c.labelOff.x, y: c.labelOff.y } : { x: 0, y: 32 },
    });
    if(!comp.label) comp.label = getNextId(C[comp.type].prefix, C[comp.type].subLabel);
    state.components.push(comp);
  }
  for(const w of (data.wires || [])) {
    if(!w || !Array.isArray(w.points) || w.points.length < 2) continue;
    if(!w.points.every(p => p && num(p.x) && num(p.y))) continue;
    state.wires.push({ id: w.id || genId(), points: w.points.map(p => ({ x: p.x, y: p.y })), ...(w.blank ? { blank: true } : {}) });
  }
  for(const l of (data.labels || [])) {
    if(!l || !num(l.x) || !num(l.y)) continue;
    state.labels.push({ id: l.id || genId(), x: l.x, y: l.y, text: String(l.text ?? ''), size: num(l.size) ? l.size : 12 });
  }
  state.junctions = (data.junctions || []).filter(j => j && num(j.x) && num(j.y)).map(j => ({ x: Math.round(j.x), y: Math.round(j.y), disconnected: !!j.disconnected, removed: !!j.removed }));

  if(data.counter && typeof data.counter === 'object') state.counter = { ...data.counter };
  for(const c of state.components) {
    const m = /^([A-Z]+)_?\{?(\d+)\}?$/.exec(c.label);
    if(m && (state.counter[m[1]] || 0) < +m[2]) state.counter[m[1]] = +m[2];
  }
  if(!(data.version >= 4)) migratePins();
  state.components.forEach(renderComp);
  state.wires.forEach(renderWire);
  state.labels.forEach(renderText);
  updateJunctions();
  clearSelection();
}

function loadJSON(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object') throw new Error('Keine gültige Projektdatei');
      loadData(data);
      zoomFit();
      pushHistory();
      showToast('Projekt geladen (' + state.components.length + ' Bauteile, ' + state.wires.length + ' Leitungen)');
    } catch(err) {
      showToast('Fehler beim Laden: ' + err.message);
    }
  };
  reader.onerror = () => showToast('Datei konnte nicht gelesen werden');
  reader.readAsText(file);
}

function clearAll() {
  for(const id of ['components-layer', 'wires-layer', 'junctions-layer', 'labels-layer', 'temp-layer']) $(id).innerHTML = '';
  state.components = [];
  state.wires = [];
  state.labels = [];
  state.junctions = [];
  state.sel = null;
  state.multi = [];
  cancelTransient();
}

function freshCounter() {
  return { R:0, C:0, L:0, D:0, Q:0, T:0, S:0, K:0, M:0, G:0, V:0, F:0, N:0, IC:0, X:0, P:0, U:0, Y:0, B:0, H:0, A:0, E:0 };
}

function newProject() {
  if(state.components.length || state.wires.length || state.labels.length) {
    if(!confirm('Wirklich neu beginnen? Ungespeicherte Änderungen gehen verloren.')) return;
  }
  clearAll();
  state.counter = freshCounter();
  setTool('select');
  pushHistory();
  showToast('Neues Projekt gestartet');
}

// ============================================================
// VERLAUF (Undo / Redo) + AUTOSAVE
// ============================================================

const AUTOSAVE_KEY = 'vectronix-autosave-v1';
let autosaveTimer;

function pushHistory() {
  state.history = state.history.slice(0, state.historyIdx + 1);
  state.history.push(JSON.stringify(projectData()));
  if(state.history.length > state.maxHistory) state.history.shift();
  state.historyIdx = state.history.length - 1;
  updateUndoButtons();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 400);
  if(state.sim) runSim();
}

function autosave() {
  try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(projectData())); } catch(e) { /* z. B. privater Modus */ }
}

function updateUndoButtons() {
  $('btn-undo').disabled = state.historyIdx <= 0;
  $('btn-redo').disabled = state.historyIdx >= state.history.length - 1;
}

function restoreHistory() {
  const keep = state.counter;
  loadData(JSON.parse(state.history[state.historyIdx]));
  if(state.sim) runSim();
  for(const [k, v] of Object.entries(keep)) if((state.counter[k] || 0) < v) state.counter[k] = v;
  updateUndoButtons();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 400);
}

function undo() {
  if(state.historyIdx <= 0) return;
  state.historyIdx--;
  restoreHistory();
}

function redo() {
  if(state.historyIdx >= state.history.length - 1) return;
  state.historyIdx++;
  restoreHistory();
}

// ============================================================
// DOWNLOAD / TOAST
// ============================================================

function download(content, filename, mime) { downloadBlob(new Blob([content], { type: mime }), filename); }

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

let toastTimeout;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2400);
}

// ============================================================
// ZEICHENFLÄCHE: EREIGNISSE
// ============================================================

canvas.addEventListener('pointerdown', e => {
  if(e.button === 1) { e.preventDefault(); startPan(e); return; }
  if(e.button !== 0) return;
  closeMenu();
  const tool = state.tool;

  // Setzen erst beim Loslassen ohne Bewegung – Ziehen verschiebt stattdessen die Ansicht
  if(tool === 'place') { startPan(e, ev => placeAt(ev)); return; }
  if(tool === 'text') { startPan(e, ev => { const p = getSnappedPos(ev); addText(p.x, p.y); }); return; }
  if(tool === 'wire') { wireGesture(e); return; }
  if(tool === 'rect') { rectGesture(e); return; }
  if(tool === 'lasso' || (tool === 'select' && e.shiftKey)) { lassoGesture(e); return; }
  if(tool === 'select') startPan(e, () => clearSelection());
});

canvas.addEventListener('pointermove', e => {
  if(isTouch(e)) return; // Touch-Vorschau läuft über die jeweilige Geste
  const pos = getSnappedPos(e);
  $('cursor-pos').textContent = `X: ${pos.x}  Y: ${pos.y}`;
  if(state.tool === 'place') movePreview(e);
  else if(state.tool === 'wire') {
    const pt = getWirePoint(e);
    if(state.wireStart) updateWire(pt, e.shiftKey);
    else showSnapIndicator(pt);
  }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  // Langes Drücken auf Touch-Geräten soll das Werkzeug nicht beenden
  if(lastPointerType !== 'touch' && state.tool !== 'select') setTool('select');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  // Trackpad-Pinch kommt als Rad-Ereignis mit Strg und feinen Schritten
  const factor = e.ctrlKey ? Math.exp(-e.deltaY * 0.01) : (e.deltaY < 0 ? 1.15 : 1 / 1.15);
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

// ============================================================
// TASTATUR
// ============================================================

function typing(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    closeMenu(); closeDialog();
    if(state.tool !== 'select') setTool('select'); else clearSelection();
    return;
  }
  if(typing(e) || $('modal-overlay').style.display !== 'none') return;
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();

  if(mod) {
    if(k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(k === 'y') { e.preventDefault(); redo(); }
    else if(k === 'd') { e.preventDefault(); duplicateSelected(); }
    else if(k === 'c' && e.shiftKey) { e.preventDefault(); copyImage(); }
    else if(k === 'c') { e.preventDefault(); copySelection(); }
    else if(k === 'e') { e.preventDefault(); openExportDialog(); }
    else if(k === 'x') { e.preventDefault(); copySelection(); deleteSelected(); }
    else if(k === 'v') { e.preventDefault(); pasteClipboard(); }
    else if(k === 'a') { e.preventDefault(); selectAll(); }
    else if(k === 's') { e.preventDefault(); saveJSON(); }
    else if(k === 'o') { e.preventDefault(); $('load-input').click(); }
    return;
  }
  if(e.altKey) return;

  if(e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if(e.shiftKey && k === 'r') setTool('rect');
  else if(k === 'v') setTool('select');
  else if(k === 'w') setTool('wire');
  else if(k === 'm') setTool('lasso');
  else if(e.key === ' ') { e.preventDefault(); toggleSim(); }
  else if(k === 't') { e.preventDefault(); setTool('text'); }
  else if(k === 'r') rotateSelected();
  else if(k === 'f') zoomFit();
  else if(e.key === '+' || e.key === '=') zoomIn();
  else if(e.key === '-') zoomOut();
  else if(e.key === '0') zoomReset();
  else if(e.key === '?') showHelp();
});

// ============================================================
// START
// ============================================================

function init() {
  document.querySelectorAll('i[data-i]').forEach(n => { n.outerHTML = icon(n.dataset.i, n.dataset.i === 'chev' ? 'chev' : ''); });
  initPalette();
  applyGrid();
  try { if(localStorage.getItem('vectronix-sidebar') === '0') toggleSidebar(false); } catch(e) {}
  new ResizeObserver(applyView).observe($('canvas-wrap'));
  resetView();
  let restored = false;
  try {
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if(saved) {
      const data = JSON.parse(saved);
      if(data && ((data.components || []).length || (data.wires || []).length || (data.labels || []).length)) {
        loadData(data);
        zoomFit();
        restored = true;
      }
    }
  } catch(e) { /* defekter Autosave wird ignoriert */ }
  pushHistory();
  showToast(restored ? 'Letzte Sitzung wiederhergestellt' : 'Vectronix bereit – Bauteil in der Palette antippen oder auf die Fläche ziehen');
  loadFromHash().then(shared => {
    let seen = true;
    try { seen = !!localStorage.getItem(INTRO_KEY); } catch(e) {}
    if(!seen && !shared && !restored) showIntro();
  });
  window.addEventListener('hashchange', loadFromHash);
}

window.addEventListener('load', init);

// Offline-Nutzung / Installation als App (nur über http/https, nicht bei file://)
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
