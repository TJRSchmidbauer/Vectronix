<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Vectronix – webbasierter Schaltplan-Editor nach DIN EN 60617 mit SVG- und LaTeX-TikZ-Export. Läuft komplett lokal im Browser.">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M4 16h6l3-8 6 16 3-8h6' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Vectronix – Schaltplandesigner (DIN EN 60617)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#eef0f2;--panel:#fff;--border:#c8ccd0;--text:#1e1e2e;--accent:#2563eb;--accent-hover:#1d4ed8;--accent-light:#3b82f620;--grid:#d0d0d0;--grid-fine:#eaeaea;--sel:#3b82f640;--danger:#dc2626}
body{font-family:Inter,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
#toolbar{display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:44px;flex-shrink:0}
#toolbar .group{display:flex;align-items:center;gap:3px;padding:0 6px;border-right:1px solid var(--border)}
#toolbar .group:last-child{border-right:none}
#toolbar button,#toolbar label.btn{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:5px 8px;cursor:pointer;font-size:12px;color:var(--text);display:flex;align-items:center;gap:3px;transition:all .12s;white-space:nowrap}
#toolbar button:hover,#toolbar label.btn:hover{background:#e5e7eb;border-color:#999}
#toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-light)}
#toolbar button.active svg{stroke:#fff}
#toolbar button svg{width:16px;height:16px;stroke:var(--text);stroke-width:1.5;fill:none}
#toolbar button:disabled{opacity:.4;cursor:default}
#main{display:flex;flex:1;overflow:hidden;min-height:0}
#sidebar{width:185px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:6px 8px}
#sidebar h3{font-size:11px;font-weight:600;text-transform:uppercase;color:#888;margin:10px 4px 4px;letter-spacing:.5px}
#sidebar .parts{display:grid;grid-template-columns:1fr;gap:3px}
#sidebar .part-btn{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:5px 4px 3px;cursor:grab;text-align:center;transition:all .12s;font-size:10px;line-height:1.2;word-break:break-word;overflow-wrap:break-word;touch-action:none}
#sidebar .part-btn:hover{background:#f0f4ff;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-light);transform:translateY(-1px)}
#sidebar .part-btn svg{display:block;margin:0 auto 1px;width:36px;height:22px}
#canvas-wrap{flex:1;overflow:hidden;position:relative;background:var(--bg);min-width:0}
#canvas{display:block;width:100%;height:100%;touch-action:none}
#statusbar{display:flex;align-items:center;justify-content:space-between;padding:2px 12px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:#666;flex-shrink:0;gap:12px}
#statusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px #00000025;padding:4px;z-index:1000;min-width:170px}
.context-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 12px;font-size:12px;cursor:pointer;border-radius:4px;color:var(--text)}
.context-menu button:hover{background:#e5e7eb}
.context-menu hr{margin:4px 0;border:none;border-top:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:#00000030;z-index:2000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;box-shadow:0 8px 32px #00000020;min-width:300px;max-width:90vw;max-height:90vh;overflow-y:auto;user-select:text;-webkit-user-select:text}
.modal h2{font-size:17px;margin-bottom:12px;color:var(--text)}
.modal label{display:block;font-size:12px;font-weight:500;margin-bottom:3px;margin-top:10px;color:#555}
.modal input[type=text],.modal input[type=number],.modal textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:inherit}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.modal textarea{min-height:50px;resize:vertical;font-family:monospace}
.modal .hint{margin-top:8px;font-size:11px;color:#888;background:#f5f5f5;padding:6px 8px;border-radius:4px}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal .btns button{padding:7px 18px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:13px;background:#fff;color:var(--text)}
.modal .btns button:hover{background:#f3f4f6}
.modal .btns .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal .btns .primary:hover{background:var(--accent-hover)}
.modal table{border-collapse:collapse;font-size:13px}
.modal td{padding:3px 14px 3px 0;vertical-align:top}
.modal kbd{background:#f3f4f6;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;font-family:inherit}
#selection-rect{fill:var(--sel);stroke:#16a34a;stroke-width:1.5;stroke-dasharray:4,3;display:none;pointer-events:none}
.junction-dot{cursor:pointer}
.junction-dot:hover{fill:#f59e0b}
.wire-hit{stroke:transparent}
.wire-g.wire-sel .wire{stroke:var(--accent);stroke-width:1.6}
.wire-handle{fill:#fff;stroke:var(--accent);stroke-width:1.2;pointer-events:none}
.label-sel text{fill:var(--accent)}
.pin-handle{cursor:crosshair}
.comp-selected .comp-body *:not(text):not(.pin-handle){stroke:var(--accent)}
.comp-selected .comp-body [fill="#000"]{fill:var(--accent)}
.comp-selected .comp-body text{fill:var(--accent);stroke:none}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#1e1e2eee;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3000;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:760px){
  #main{flex-direction:column}
  #sidebar{width:100%;height:92px;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 6px;gap:3px}
  #sidebar h3{display:none}
  #sidebar .parts{display:flex;gap:3px}
  #sidebar .part-btn{width:74px;flex-shrink:0}
  #toolbar{padding:2px 4px}
  #toolbar .group{padding:0 3px}
  #toolbar small{display:none}
  #statusbar .sb-brand{display:none}
}
</style>
</head>
<body>

<div id="toolbar">
  <div class="group" id="tool-group">
    <button id="tool-select" class="active" onclick="setTool('select')" title="Auswählen / Verschieben (V)"><svg viewBox="0 0 16 16"><path d="M3 2l9 6-4 1-2 4z"/></svg><small>Auswahl</small></button>
    <button id="tool-wire" onclick="setTool('wire')" title="Leitung ziehen (W)"><svg viewBox="0 0 16 16"><polyline points="2,14 2,6 14,6 14,2"/></svg><small>Leitung</small></button>
    <button id="tool-text" onclick="setTool('text')" title="Text einfügen (T)"><svg viewBox="0 0 16 16"><text x="8" y="13" font-size="14" text-anchor="middle" font-weight="bold" fill="currentColor">A</text></svg><small>Text</small></button>
    <button id="tool-rect" onclick="setTool('rect')" title="Export-Bereich auswählen (Umschalt+R)"><svg viewBox="0 0 16 16" stroke-dasharray="2,1.5"><rect x="2" y="2" width="12" height="12"/></svg><small>Bereich</small></button>
  </div>
  <div class="group">
    <button onclick="rotateSelected()" title="Drehen (R)"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"/></svg></button>
    <button onclick="duplicateSelected()" title="Duplizieren (Strg+D)"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9"/><path d="M11 5V2H2v9h3"/></svg></button>
    <button onclick="deleteSelected()" title="Löschen (Entf)"><svg viewBox="0 0 16 16"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10"/></svg></button>
    <button id="btn-undo" onclick="undo()" title="Rückgängig (Strg+Z)"><svg viewBox="0 0 16 16"><polyline points="8,15 3,10 8,5"/><line x1="3" y1="10" x2="13" y2="10"/></svg></button>
    <button id="btn-redo" onclick="redo()" title="Wiederholen (Strg+Y)"><svg viewBox="0 0 16 16"><polyline points="8,5 13,10 8,15"/><line x1="13" y1="10" x2="3" y2="10"/></svg></button>
    <button onclick="newProject()" title="Neues Projekt"><svg viewBox="0 0 16 16"><path d="M4 1h6l3 3v11H4zM10 1v3h3"/></svg></button>
  </div>
  <div class="group">
    <label class="btn" title="Raster anzeigen"><input type="checkbox" id="grid-check" checked onchange="toggleGrid()" style="width:13px;height:13px;margin:0;accent-color:var(--accent)">Raster</label>
  </div>
  <div class="group">
    <button onclick="exportSVG()" title="Als SVG exportieren (Bereichsauswahl wird genutzt)"><svg viewBox="0 0 16 16"><path d="M3 12v1h10v-1M5 7l3 4 3-4M8 11V2"/></svg><small>SVG</small></button>
    <button onclick="exportTikZ()" title="Als LaTeX (circuitikz) exportieren (Bereichsauswahl wird genutzt)"><svg viewBox="0 0 16 16"><path d="M3 12v1h10v-1M5 7l3 4 3-4M8 11V2"/></svg><small>TikZ</small></button>
    <button onclick="clearArea()" title="Bereichsauswahl aufheben">✕ Bereich</button>
  </div>
  <div class="group">
    <button onclick="zoomOut()" title="Verkleinern (−)">−</button>
    <button onclick="zoomReset()" title="Zoom 1:1 (0)">1:1</button>
    <button onclick="zoomIn()" title="Vergrößern (+)">+</button>
    <button onclick="zoomFit()" title="Alles anzeigen (F)">⤢</button>
  </div>
  <div class="group">
    <button onclick="saveJSON()" title="Projekt speichern (Strg+S)"><svg viewBox="0 0 16 16"><path d="M13 8v5H3V8M8 2v8"/><polyline points="5,7 8,10 11,7"/></svg><small>Speichern</small></button>
    <button onclick="document.getElementById('load-input').click()" title="Projekt laden (Strg+O)"><svg viewBox="0 0 16 16"><path d="M13 8v5H3V8M8 10V2"/><polyline points="5,5 8,2 11,5"/></svg><small>Laden</small></button>
    <input type="file" id="load-input" accept=".vectronix,.json" style="display:none" onchange="loadJSON(event)">
    <button onclick="showHelp()" title="Hilfe & Tastenkürzel (?)">?</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <h3>Passiv</h3><div class="parts" id="parts-passive"></div>
    <h3>Halbleiter</h3><div class="parts" id="parts-semi"></div>
    <h3>Schalter / Ausgänge</h3><div class="parts" id="parts-switch"></div>
    <h3>Quellen</h3><div class="parts" id="parts-source"></div>
    <h3>Logik / Sonstige</h3><div class="parts" id="parts-other"></div>
  </div>
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid-fine" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M16 0L0 0 0 16" fill="none" stroke="#eaeaea" stroke-width=".5"/>
        </pattern>
        <pattern id="grid-main" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M80 0L0 0 0 80" fill="none" stroke="#d0d0d0" stroke-width=".8"/>
        </pattern>
      </defs>
      <rect id="grid-bg-fine" fill="url(#grid-fine)"/>
      <rect id="grid-bg-main" fill="url(#grid-main)"/>
      <g id="wires-layer"></g>
      <g id="junctions-layer"></g>
      <g id="components-layer"></g>
      <g id="labels-layer"></g>
      <rect id="selection-rect"/>
      <g id="temp-layer"></g>
    </svg>
  </div>
</div>

<div id="statusbar">
  <span><span id="cursor-pos">X: 0  Y: 0</span> | <span id="zoom-level">100%</span> | <span id="mode-info">Auswählen</span></span>
  <span><span class="sb-brand">Vectronix · DIN EN 60617 · </span><a href="https://schmidbauer.jetzt/impressum/" target="_blank" rel="noopener" style="color:inherit">Impressum</a> · <a href="https://schmidbauer.jetzt/datenschutz/" target="_blank" rel="noopener" style="color:inherit">Datenschutz</a></span>
</div>

<div id="context-menu" class="context-menu" style="display:none"></div>
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>
<div id="toast" class="toast"></div>
<noscript>Vectronix benötigt JavaScript.</noscript>

<script>

const SVG_NS = 'http://www.w3.org/2000/svg';

const state = {
  tool: 'select',
  components: [],
  wires: [],
  labels: [],
  junctions: [],
  sel: null,            // {type:'c'|'w'|'l', id}
  counter: { R:0, C:0, L:0, D:0, Q:0, T:0, S:0, K:0, M:0, G:0, V:0, F:0, N:0, IC:0, X:0, P:0, U:0, Y:0, B:0, H:0, A:0, E:0 },
  grid: true,
  wireStart: null,
  selStart: null,
  selRect: null,        // {x,y,w,h} Export-Bereich
  placeType: null,
  view: { x: -40, y: -40, k: 1 },
  history: [],
  historyIdx: -1,
  maxHistory: 60,
};

// ============================================================
// BAUTEIL-DEFINITIONEN (DIN EN 60617)
// ============================================================
// Koordinaten relativ zum Bauteil-Mittelpunkt (0,0); pins = Anschlusspunkte

const C = {
  resistor: {
    name: 'Widerstand', prefix: 'R',
    svg: `<rect x="-30" y="-10" width="60" height="20" rx="1" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="-40" y1="0" x2="-30" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="30" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-40,y:0},{x:40,y:0}], w:80, h:20
  },
  potentiometer: {
    name: 'Potentiometer', prefix: 'R',
    svg: `<rect x="-30" y="-10" width="60" height="20" rx="1" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="-40" y1="0" x2="-30" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="30" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="10" x2="0" y2="24" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="10" x2="20" y2="-16" stroke="#000" stroke-width="1.2"/>
      <polygon points="24,-20 20,-16 22,-14" fill="#000"/>`,
    pins: [{x:-40,y:0},{x:40,y:0},{x:0,y:24}], w:80, h:48
  },
  capacitor: {
    name: 'Kondensator', prefix: 'C',
    svg: `<line x1="0" y1="-20" x2="0" y2="-4" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="4" x2="0" y2="20" stroke="#000" stroke-width="1.0"/>
      <line x1="-16" y1="-4" x2="16" y2="-4" stroke="#000" stroke-width="2.5"/>
      <line x1="-16" y1="4" x2="16" y2="4" stroke="#000" stroke-width="2.5"/>`,
    pins: [{x:0,y:-20},{x:0,y:20}], w:32, h:40
  },
  polarized_capacitor: {
    name: 'Elko', prefix: 'C',
    svg: `<line x1="0" y1="-20" x2="0" y2="-4" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="4" x2="0" y2="20" stroke="#000" stroke-width="1.0"/>
      <line x1="-16" y1="-4" x2="16" y2="-4" stroke="#000" stroke-width="1.0"/>
      <rect x="-16" y="4" width="32" height="8" fill="#000"/>
      <text class="cap-plus" x="-22" y="-4" font-size="9" fill="#000" text-anchor="middle">+</text>`,
    pins: [{x:0,y:-20},{x:0,y:20}], w:32, h:40
  },
  inductor: {
    name: 'Spule', prefix: 'L',
    svg: `<path d="M-40 0 L-32 0
      M-32 0 Q-24 -16 -16 0 Q-8 -16 0 0 Q8 -16 16 0 Q24 -16 32 0
      L40 0" fill="none" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-40,y:0},{x:40,y:0}], w:80, h:20
  },
  diode: {
    name: 'Diode', prefix: 'D',
    svg: `<polygon points="20,0 -20,-24 -20,24" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="20" y1="-24" x2="20" y2="24" stroke="#000" stroke-width="1.0"/>
      <line x1="-28" y1="0" x2="-20" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="28" y1="0" x2="20" y2="0" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-28,y:0},{x:28,y:0}], w:56, h:48
  },
  led: {
    name: 'LED', prefix: 'D',
    svg: `<polygon points="20,0 -20,-24 -20,24" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="20" y1="-24" x2="20" y2="24" stroke="#000" stroke-width="1.0"/>
      <line x1="-28" y1="0" x2="-20" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="28" y1="0" x2="20" y2="0" stroke="#000" stroke-width="1.0"/>
      <polygon points="12,-28 4,-28 8,-36" fill="#000"/>
      <line x1="8" y1="-36" x2="8" y2="-44" stroke="#000" stroke-width="1"/>
      <line x1="-4" y1="-32" x2="8" y2="-36" stroke="#000" stroke-width=".8"/>
      <line x1="8" y1="-36" x2="20" y2="-36" stroke="#000" stroke-width=".8"/>`,
    pins: [{x:-28,y:0},{x:28,y:0}], w:56, h:72
  },
  fuse: {
    name: 'Sicherung', prefix: 'F',
    svg: `<rect x="-30" y="-8" width="60" height="16" rx="1" fill="none" stroke="#000" stroke-width="1.0"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="-40" y1="0" x2="-30" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="30" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-40,y:0},{x:40,y:0}], w:80, h:16
  },
  // Switches
  switch: {
    name: 'Schalter', prefix: 'S',
    svg: `<line x1="-32" y1="0" x2="-4" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="-4" y1="0" x2="28" y2="-24" stroke="#000" stroke-width="1.0"/>
      <line x1="32" y1="0" x2="44" y2="0" stroke="#000" stroke-width="1.0"/>
      <circle cx="32" cy="0" r="3" fill="#000"/>`,
    pins: [{x:-32,y:0},{x:44,y:0}], w:76, h:48
  },
  // Sources
  battery: {
    name: 'Batterie', prefix: 'G',
    svg: `<line x1="0" y1="-28" x2="0" y2="-8" stroke="#000" stroke-width="1.0"/>
      <line x1="0" y1="8" x2="0" y2="28" stroke="#000" stroke-width="1.0"/>
      <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#000" stroke-width="1.0"/>
      <line x1="-10" y1="8" x2="10" y2="8" stroke="#000" stroke-width="4.5"/>
      <text class="bat-plus" x="-24" y="-8" font-size="10" fill="#000" text-anchor="middle">+</text>`,
    pins: [{x:0,y:-28},{x:0,y:28}], w:40, h:56
  },
  dc_source: {
    name: 'Gleichspannungsquelle', prefix: 'V',
    svg: `<circle cx="0" cy="0" r="28" fill="none" stroke="#000" stroke-width="1.0"/>
      <text x="0" y="-4" font-size="15" fill="#000" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-weight="bold">+</text>
      <text x="0" y="16" font-size="15" fill="#000" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-weight="bold">−</text>
      <line x1="-40" y1="0" x2="-28" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="28" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-40,y:0},{x:40,y:0}], w:80, h:56
  },
  ac_source: {
    name: 'Wechselspannungsquelle', prefix: 'G',
    svg: `<circle cx="0" cy="0" r="28" fill="none" stroke="#000" stroke-width="1.0"/>
      <text x="0" y="5" font-size="22" fill="#000" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-weight="bold">∼</text>
      <line x1="-40" y1="0" x2="-28" y2="0" stroke="#000" stroke-width="1.0"/>
      <line x1="28" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.0"/>`,
    pins: [{x:-40,y:0},{x:40,y:0}], w:80, h:56
  },
  gnd: {
    name: 'Masse', prefix: 'E',
    svg: `<line x1="-24" y1="0" x2="24" y2="0" stroke="#000" stroke-width="2.5"/>
      <line x1="-16" y1="8" x2="16" y2="8" stroke="#000" stroke-width="1.0"/>

// ============================================================
// HILFSFUNKTIONEN
// ============================================================

const GRID = 8;
const PIN_SNAP = 12;
const snap = v => Math.round(v / GRID) * GRID;
const $ = id => document.getElementById(id);
const canvas = $('canvas');

function genId() { return (Math.random()*36**8|0).toString(36) + Date.now().toString(36).slice(-4); }

function getNextId(prefix) {
  if(!state.counter[prefix]) state.counter[prefix] = 0;
  let id;
  do { state.counter[prefix]++; id = prefix + state.counter[prefix]; }
  while(state.components.some(c => c.label === id));
  return id;
}

function el(tag, attr, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  if(attr) for(const [k, v] of Object.entries(attr)) e.setAttribute(k, v);
  if(parent) parent.appendChild(e);
  return e;
}

function escapeXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const SUB = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋'};
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};

function latexToUnicode(s) {
  const m = {
    '\\Omega':'Ω','\\Delta':'Δ','\\Phi':'Φ','\\Theta':'Θ','\\mu':'μ','\\alpha':'α','\\beta':'β','\\gamma':'γ',
    '\\delta':'δ','\\epsilon':'ε','\\theta':'θ','\\lambda':'λ','\\pi':'π',
    '\\sigma':'σ','\\omega':'ω','\\varphi':'φ','\\times':'×','\\cdot':'·','\\sim':'~','\\partial':'∂','\\infty':'∞',
    '\\neq':'≠','\\leq':'≤','\\geq':'≥','\\approx':'≈','\\pm':'±',
    '\\mathrm':'','\\text':'','\\;':' ','\\,':' ','\\!':''
  };
  s = String(s).replace(/\$\$([^$]+)\$\$/g, '$1').replace(/\$([^$]+)\$/g, '$1');
  for(const [k, v] of Object.entries(m)) s = s.split(k).join(v);
  s = s.replace(/_\{([^}]*)\}|_([0-9a-zA-Z+-])/g, (all, a, b) => {
    const t = a ?? b;
    return [...t].every(ch => SUB[ch]) ? [...t].map(ch => SUB[ch]).join('') : all;
  });
  s = s.replace(/\^\{([^}]*)\}|\^([0-9+-])/g, (all, a, b) => {
    const t = a ?? b;
    return [...t].every(ch => SUP[ch]) ? [...t].map(ch => SUP[ch]).join('') : all;
  });
  return s.replace(/[{}]/g, '');
}

// ============================================================
// ANSICHT (Zoom / Verschieben)
// ============================================================

function applyView() {
  const wrap = $('canvas-wrap');
  const w = wrap.clientWidth || 800, h = wrap.clientHeight || 600;
  const v = state.view;
  const vw = w / v.k, vh = h / v.k;
  canvas.setAttribute('viewBox', `${v.x} ${v.y} ${vw} ${vh}`);
  for(const id of ['grid-bg-fine', 'grid-bg-main']) {
    const r = $(id);
    r.setAttribute('x', v.x); r.setAttribute('y', v.y);
    r.setAttribute('width', vw); r.setAttribute('height', vh);
  }
  $('zoom-level').textContent = Math.round(v.k * 100) + '%';
}

function zoomAt(clientX, clientY, factor) {
  const v = state.view;
  const rect = $('canvas-wrap').getBoundingClientRect();
  const sx = clientX - rect.left, sy = clientY - rect.top;
  const wx = v.x + sx / v.k, wy = v.y + sy / v.k;
  v.k = Math.min(4, Math.max(0.2, v.k * factor));
  v.x = wx - sx / v.k; v.y = wy - sy / v.k;
  applyView();
}

function zoomCenter(factor) {
  const r = $('canvas-wrap').getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
}
function zoomIn() { zoomCenter(1.25); }
function zoomOut() { zoomCenter(1 / 1.25); }
function zoomReset() {
  const r = $('canvas-wrap').getBoundingClientRect();
  const v = state.view;
  const cx = v.x + r.width / 2 / v.k, cy = v.y + r.height / 2 / v.k;
  v.k = 1; v.x = cx - r.width / 2; v.y = cy - r.height / 2;
  applyView();
}
function zoomFit() {
  if(!state.components.length && !state.wires.length && !state.labels.length) { resetView(); return; }
  const b = contentBounds();
  const r = $('canvas-wrap').getBoundingClientRect();
  const k = Math.min(2, Math.max(0.2, Math.min(r.width / b.w, r.height / b.h) * 0.95));
  state.view.k = k;
  state.view.x = b.x + b.w / 2 - r.width / 2 / k;
  state.view.y = b.y + b.h / 2 - r.height / 2 / k;
  applyView();
}
function resetView() { state.view = { x: -40, y: -40, k: 1 }; applyView(); }

function startPan(e) {
  let lx = e.clientX, ly = e.clientY;
  canvas.style.cursor = 'grabbing';
  track(ev => {
    state.view.x -= (ev.clientX - lx) / state.view.k;
    state.view.y -= (ev.clientY - ly) / state.view.k;
    lx = ev.clientX; ly = ev.clientY;
    applyView();
  }, () => { canvas.style.cursor = ''; });
}

window.addEventListener('resize', applyView);

// ============================================================
// POINTER-HILFE
// ============================================================

function track(onMove, onUp) {
  const mv = e => onMove && onMove(e);
  const up = e => {
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    onUp && onUp(e);
  };
  document.addEventListener('pointermove', mv);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function getRawPos(e) {
  const pt = canvas.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(canvas.getScreenCTM().inverse());
}

function getSnappedPos(e) {
  const p = getRawPos(e);
  return { x: snap(p.x), y: snap(p.y) };
}

// Rastet an Bauteil-Pins ein (Radius PIN_SNAP), sonst am Raster
function getWirePoint(e) {
  const raw = getRawPos(e);
  const r = PIN_SNAP / Math.max(state.view.k, 0.5);
  let best = null, bd = r;
  for(const c of state.components) {
    const def = C[c.type];
    for(let i = 0; i < def.pins.length; i++) {
      const p = pinWorld(c, i);
      const d = Math.hypot(p.x - raw.x, p.y - raw.y);
      if(d <= bd) { bd = d; best = p; }
    }
  }
  if(best) return { x: best.x, y: best.y, pin: true };
  return { x: snap(raw.x), y: snap(raw.y) };
}

const TOOL_NAMES = { select:'Auswählen', wire:'Leitung zeichnen – Klick setzt Start und Ziel (Umschalt = diagonal, Esc = Ende)', text:'Text einfügen – Klick auf die Zeichenfläche', rect:'Export-Bereich aufziehen' };

function cancelTransient() {

  $('temp-layer').innerHTML = '';

  state.tool = t;
  setToolUI(t);
}

// ============================================================
// BAUTEIL-GEOMETRIE
// ============================================================

function rot(x, y, a) {
  a = (((a || 0) % 360) + 360) % 360;
  switch(a) {
    case 90: return { x: -y, y: x };
    case 180: return { x: -x, y: -y };
    case 270: return { x: y, y: -x };
    default: return { x, y };
  }
}

function pinWorld(c, i) {
  const p = C[c.type].pins[i];
  const r = rot(p.x, p.y, c.angle);
  return { x: c.x + r.x, y: c.y + r.y };
}

// Welche Leitungs-Punkte liegen auf Pins dieses Bauteils?
function attachedEnds(c) {
  const out = [];
  const def = C[c.type];
  for(const wire of state.wires)
    for(let idx = 0; idx < wire.points.length; idx++)
      for(let i = 0; i < def.pins.length; i++) {
        const p = pinWorld(c, i);
        if(Math.abs(wire.points[idx].x - p.x) <= 2 && Math.abs(wire.points[idx].y - p.y) <= 2)
          out.push({ wire, idx, pin: i });
      }
  return out;
}

function moveAttached(c, ends) {
  for(const a of ends) {
    const p = pinWorld(c, a.pin);
    moveWirePoint(a.wire, a.idx, p.x, p.y);
    renderWire(a.wire);
  }
}

// Verschiebt einen Leitungspunkt und hält angrenzende, innere Eckpunkte rechtwinklig
function moveWirePoint(wire, idx, nx, ny) {
  const pts = wire.points, p = pts[idx];
  if(pts.length === 2) {
    // gerade Leitung bleibt rechtwinklig: bei Verschiebung wird eine Ecke eingefügt
    const o = pts[1 - idx];
    const horiz = o.y === p.y, vert = o.x === p.x;
    p.x = nx; p.y = ny;
    if(horiz !== vert && ((horiz && ny !== o.y) || (vert && nx !== o.x)) && !(horiz && nx === o.x) && !(vert && ny === o.y)) {
      const corner = horiz ? { x: nx, y: o.y } : { x: o.x, y: ny };
      pts.splice(1, 0, corner);
    }
    return;
  }
  for(const i of [idx - 1, idx + 1]) {
    if(i <= 0 || i >= pts.length - 1) continue;
    const q = pts[i];
    if(q.y === p.y && q.x !== p.x) q.y = ny;
    else if(q.x === p.x && q.y !== p.y) q.x = nx;
  }
  p.x = nx; p.y = ny;
}

function initPalette() {
  const cats = {
    'parts-passive': ['resistor','potentiometer','capacitor','polarized_capacitor','inductor','fuse'],
    'parts-semi': ['diode','led'],
    'parts-switch': ['switch','lamp','motor'],
    'parts-source': ['battery','dc_source','ac_source','gnd'],
    'parts-other': ['transformer','transformer_air','meter','ammeter','opamp','and_gate','or_gate','not_gate'],
  };
  for(const [containerId, keys] of Object.entries(cats)) {
    const container = $(containerId);
    for(const key of keys) {
      const def = C[key];
      if(!def) continue;
      const btn = document.createElement('div');
      btn.className = 'part-btn';
      btn.title = def.name + ' – ziehen oder anklicken';
      const w = Math.max(def.w, 60), h = Math.max(def.h, 40);
      const vb = `${-w/2 - 4} ${-h/2 - 4} ${w + 8} ${h + 8}`;
      btn.innerHTML = `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">${compBodySVG({ type:key, showPolarity:true })}</svg>${def.name}`;
      btn.addEventListener('pointerdown', e => { if(e.button === 0) { e.preventDefault(); startPlace(key, e); } });
      container.appendChild(btn);
    }
  }
}

// Platzieren: Ziehen auf die Fläche = einmal; Anklicken = Platziermodus (Klick setzt, Esc beendet)
function startPlace(type, e) {
  cancelTransient();
  state.tool = 'place';
  state.placeType = type;
  document.querySelectorAll('#tool-group button').forEach(b => b.classList.remove('active'));
  canvas.style.cursor = 'copy';
  $('mode-info').textContent = `${C[type].name}: Klick setzt Bauteil, Esc beendet`;
  showPreview(type);
  const sx = e.clientX, sy = e.clientY;
  let dragged = false;
  track(ev => {
    if(Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) dragged = true;
    if(dragged) movePreview(ev);
  }, ev => {
    if(!dragged || state.tool !== 'place') return;
    if(overCanvas(ev)) placeAt(ev);
    setTool('select');
  });
}

function overCanvas(e) {
  const t = document.elementFromPoint(e.clientX, e.clientY);
  return !!(t && t.closest && t.closest('#canvas'));
}

function showPreview(type) {
  $('temp-layer').innerHTML = `<g id="place-preview" opacity="0.5" style="display:none" pointer-events="none">${compBodySVG({ type, showPolarity:true })}</g>`;
}

function movePreview(e) {
  const pv = $('place-preview');
  if(!pv) return;
  const pos = getSnappedPos(e);
  pv.style.display = '';
  pv.setAttribute('transform', `translate(${pos.x},${pos.y})`);
  $('cursor-pos').textContent = `X: ${pos.x}  Y: ${pos.y}`;
}

function placeAt(e) {
  const pos = getSnappedPos(e);
  const comp = addComponent(state.placeType, pos.x, pos.y);
  if(comp) { select('c', comp.id); pushHistory(); }
}

// ============================================================
// BAUTEILE
// ============================================================

function newComp(type, x, y, extra) {
  return Object.assign({ id: genId(), type, x, y, label: '', value: '', angle: 0, showPolarity: false, labelOff: { x: 0, y: 32 } }, extra);
}

function addComponent(type, x, y) {
  const def = C[type];
  if(!def) return null;
  const comp = newComp(type, x, y, { label: getNextId(def.prefix) });
  state.components.push(comp);
  renderComp(comp);
  return comp;
}

// Markup des Symbols (ohne Beschriftung); identisch für Anzeige, Palette und Export
function compBodySVG(comp) {
  let s = C[comp.type].svg;
  if(!comp.showPolarity) s = s.replace(/<text class="(?:bat|cap)-plus"[^>]*>[^<]*<\/text>/, '');
  return s;
}

function compLabelSVG(comp) {
  const lo = comp.labelOff || { x: 0, y: 32 };
  let s = `<g class="comp-label" transform="translate(${lo.x},${lo.y})" style="cursor:move">`;
  s += `<text class="label-text" x="0" y="9" font-size="11" font-family="Inter,sans-serif" fill="#000" text-anchor="middle">${escapeXml(latexToUnicode(comp.label))}</text>`;
  if(comp.value) s += `<text class="value-text" x="0" y="23" font-size="10" font-family="Inter,sans-serif" fill="#555" text-anchor="middle">${escapeXml(latexToUnicode(comp.value))}</text>`;
  return s + '</g>';
}

function renderComp(comp) {
  const def = C[comp.type];
  if(!def) return;
  $('c-' + comp.id)?.remove();
  const g = el('g', { id: 'c-' + comp.id, transform: `translate(${comp.x},${comp.y})` }, $('components-layer'));

  let pinsHit = '';
  for(const pin of def.pins) pinsHit += `<circle class="pin-handle" cx="${pin.x}" cy="${pin.y}" r="9" fill="transparent"/>`;
  const rotAttr = comp.angle ? ` transform="rotate(${comp.angle})"` : '';
  g.innerHTML = `<g class="comp-body"${rotAttr}>${compBodySVG(comp)}${pinsHit}</g>${compLabelSVG(comp)}`;

  g.querySelector('.comp-label').addEventListener('pointerdown', e => {
    if(state.tool === 'select' && e.button === 0) { e.stopPropagation(); e.preventDefault(); select('c', comp.id); startLabelDrag(comp.id, e); }
  });
  g.addEventListener('pointerdown', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    if(e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    select('c', comp.id);
    startCompDrag(comp.id, e);
  });
  g.addEventListener('dblclick', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    openCompDialog(comp.id);
  });
  g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if(state.tool === 'place') { setTool('select'); return; }
    select('c', comp.id);
    showCompContextMenu(comp.id, e);
  });
  applySelection();
}

function showMenu(e, html, h) {
  const menu = $('context-menu');
  menu.innerHTML = html;
  menu.style.display = 'block';
  menu.style.left = Math.max(0, Math.min(e.clientX, window.innerWidth - 190)) + 'px';
  menu.style.top = Math.max(0, Math.min(e.clientY, window.innerHeight - h)) + 'px';
}

function closeMenu() { $('context-menu').style.display = 'none'; }
document.addEventListener('pointerdown', e => { if(!e.target.closest || !e.target.closest('#context-menu')) closeMenu(); }, true);

function showCompContextMenu(id, e) {
  showMenu(e, `
    <button onclick="openCompDialog('${id}')">✏️ Bearbeiten</button>
    <button onclick="rotateComp('${id}')">🔄 Drehen (90°)</button>
    <hr>
    <button onclick="duplicateComp('${id}')">📋 Duplizieren</button>
    <button onclick="deleteSelected()">🗑 Löschen</button>`, 170);
}

function rotateComp(id) {
  const comp = state.components.find(c => c.id === id);
  if(!comp) return;
  const ends = attachedEnds(comp);
  comp.angle = ((comp.angle || 0) + 90) % 360;
  renderComp(comp);
  moveAttached(comp, ends);
  updateJunctions();
  pushHistory();
  closeMenu();
}

function rotateSelected() {
  if(state.sel && state.sel.type === 'c') rotateComp(state.sel.id);
  else showToast('Erst ein Bauteil auswählen');
}

function duplicateComp(id) {
  const comp = state.components.find(c => c.id === id);
  const def = comp && C[comp.type];
  if(!def) return;
  const copy = newComp(comp.type, comp.x + 24, comp.y + 24, {
    label: getNextId(def.prefix), value: comp.value, angle: comp.angle || 0,
    showPolarity: !!comp.showPolarity, labelOff: { ...(comp.labelOff || { x: 0, y: 32 }) }
  });
  state.components.push(copy);
  renderComp(copy);
  select('c', copy.id);
  pushHistory();
  closeMenu();
  showToast(`${def.name} ${copy.label} dupliziert`);
}

function duplicateSelected() {
  if(state.sel && state.sel.type === 'c') duplicateComp(state.sel.id);
  else showToast('Erst ein Bauteil auswählen');
}

window.rotateComp = rotateComp;
window.duplicateComp = duplicateComp;

function select(type, id) {
  state.sel = { type, id };
  applySelection();
}

function clearSelection() {
  state.sel = null;
  applySelection();
}

function applySelection() {
  document.querySelectorAll('.comp-selected').forEach(g => g.classList.remove('comp-selected'));
  document.querySelectorAll('.wire-sel').forEach(g => g.classList.remove('wire-sel'));
  document.querySelectorAll('.label-sel').forEach(g => g.classList.remove('label-sel'));
  document.querySelectorAll('.wire-handle').forEach(h => h.remove());
  const s = state.sel;
  if(!s) return;
  if(s.type === 'c') $('c-' + s.id)?.classList.add('comp-selected');
  else if(s.type === 'l') $('l-' + s.id)?.classList.add('label-sel');
  else if(s.type === 'w') {
    const g = $('w-' + s.id), wire = state.wires.find(w => w.id === s.id);
    if(g && wire) {
      g.classList.add('wire-sel');
      for(const p of wire.points) el('circle', { cx: p.x, cy: p.y, r: 3.5, class: 'wire-handle' }, g);
    }
  }
}

// ============================================================
// BAUTEIL VERSCHIEBEN
// ============================================================

function startCompDrag(id, e) {
  const comp = state.components.find(c => c.id === id);
  if(!comp) return;
  const pos = getSnappedPos(e);
  const ofs = { x: comp.x - pos.x, y: comp.y - pos.y };
  const ends = attachedEnds(comp);
  const sx = e.clientX, sy = e.clientY;
  let moved = false;

  track(ev => {
    if(!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 3) return;
    moved = true;
    const p = getSnappedPos(ev);
    comp.x = p.x + ofs.x; comp.y = p.y + ofs.y;
    $('c-' + id)?.setAttribute('transform', `translate(${comp.x},${comp.y})`);
    $('cursor-pos').textContent = `X: ${comp.x}  Y: ${comp.y}`;
    moveAttached(comp, ends);
    updateJunctions();
  }, () => { if(moved) pushHistory(); });
}

function startLabelDrag(id, e) {
  const comp = state.components.find(c => c.id === id);
  if(!comp) return;
  const pos = getRawPos(e);
  if(!comp.labelOff) comp.labelOff = { x: 0, y: 32 };
  const ofs = { x: comp.labelOff.x - (pos.x - comp.x), y: comp.labelOff.y - (pos.y - comp.y) };
  let moved = false;
  track(ev => {
    moved = true;
    const p = getRawPos(ev);
    comp.labelOff.x = Math.round(p.x - comp.x + ofs.x);
    comp.labelOff.y = Math.round(p.y - comp.y + ofs.y);
    $('c-' + id)?.querySelector('.comp-label')?.setAttribute('transform', `translate(${comp.labelOff.x},${comp.labelOff.y})`);
  }, () => { if(moved) pushHistory(); });
}

// ============================================================
// LEITUNGEN
// ============================================================

function routePoints(s, ex, ey, diagonal) {
  if(diagonal || s.x === ex || s.y === ey) return [{ x: s.x, y: s.y }, { x: ex, y: ey }];
  const dx = Math.abs(ex - s.x), dy = Math.abs(ey - s.y);
  return dx >= dy
    ? [{ x: s.x, y: s.y }, { x: ex, y: s.y }, { x: ex, y: ey }]
    : [{ x: s.x, y: s.y }, { x: s.x, y: ey }, { x: ex, y: ey }];
}

function drawWirePreview(points) {
  let d = `M ${points[0].x} ${points[0].y}`;
  for(let i = 1; i < points.length; i++) d += ` L ${points[i].x} ${points[i].y}`;
  const s = state.wireStart;
  $('temp-layer').innerHTML = `<path d="${d}" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="6,4" pointer-events="none"/><circle cx="${s.x}" cy="${s.y}" r="4" fill="#2563eb" pointer-events="none"/>`;
}

function showSnapIndicator(pt) {
  let ind = $('snap-ind');
  if(!pt || !pt.pin) { ind?.remove(); return; }
  if(!ind) ind = el('circle', { id: 'snap-ind', r: 6, fill: 'none', stroke: '#16a34a', 'stroke-width': 1.5, 'pointer-events': 'none' }, $('temp-layer'));
  ind.setAttribute('cx', pt.x); ind.setAttribute('cy', pt.y);
}

function startWire(pt) {
  state.wireStart = pt;
  drawWirePreview([pt, pt]);
  $('mode-info').textContent = 'Leitung: Ziel klicken (Umschalt = diagonal, Esc = abbrechen)';
}

function updateWire(pt, shift) {
  if(!state.wireStart) return;
  drawWirePreview(routePoints(state.wireStart, pt.x, pt.y, shift));
  showSnapIndicator(pt);
}

function finishWire(pt, shift) {
  const s = state.wireStart;
  $('temp-layer').innerHTML = '';
  state.wireStart = null;
  setToolUI('wire');
  if(!s || (s.x === pt.x && s.y === pt.y)) return;
  const wire = { id: genId(), points: routePoints(s, pt.x, pt.y, shift) };
  state.wires.push(wire);
  renderWire(wire);
  updateJunctions();
  pushHistory();
}

function renderWire(wire) {
  $('w-' + wire.id)?.remove();
  const pts = wire.points;
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
  const g = el('g', { id: 'w-' + wire.id, class: 'wire-g' }, $('wires-layer'));
  el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 14, class: 'wire-hit' }, g);
  el('path', { d, fill: 'none', stroke: '#000', 'stroke-width': 1, class: 'wire', 'stroke-linejoin': 'round', style: 'cursor:pointer' }, g);

  g.addEventListener('pointerdown', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    if(e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    select('w', wire.id);
    const raw = getRawPos(e);
    const tol = 8 / state.view.k;
    const idx = wire.points.findIndex(p => Math.abs(raw.x - p.x) <= tol && Math.abs(raw.y - p.y) <= tol);
    if(idx >= 0) startWireVertexDrag(wire, idx);
  });
  g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if(state.tool !== 'select') return;
    select('w', wire.id);
    showMenu(e, `<button onclick="deleteWire('${wire.id}')">🗑 Leitung löschen</button>`, 60);
  });
  if(state.sel && state.sel.type === 'w' && state.sel.id === wire.id) applySelection();
}

function startWireVertexDrag(wire, idx) {
  let moved = false;
  track(ev => {
    moved = true;
    const p = getWirePoint(ev);
    moveWirePoint(wire, idx, p.x, p.y);
    renderWire(wire);
    updateJunctions();
  }, () => { if(moved) pushHistory(); });
}

function deleteWire(id) {
  state.wires = state.wires.filter(w => w.id !== id);
  $('w-' + id)?.remove();
  if(state.sel && state.sel.id === id) state.sel = null;
  updateJunctions();
  pushHistory();
  closeMenu();
}
window.deleteWire = deleteWire;

// ============================================================
// VERBINDUNGSPUNKTE (Knoten)
// ============================================================
// Ein Punkt wird zum Knoten, wenn dort mindestens 3 "Arme" zusammentreffen:
// Leitungsenden/Ecken zählen 1, durchlaufende Leitungen 2, Bauteil-Pins 1.

const jKey = j => j.x + ',' + j.y;
const jId = j => 'j' + String(jKey(j)).replace(/-/g, 'm').replace(',', '_');

function segIntersect(a, b, c, d) {
  const denom = (d.y - c.y) * (b.x - a.x) - (d.x - c.x) * (b.y - a.y);
  if(Math.abs(denom) < 0.001) return null;
  const ua = ((d.x - c.x) * (a.y - c.y) - (d.y - c.y) * (a.x - c.x)) / denom;
  const ub = ((b.x - a.x) * (a.y - c.y) - (b.y - a.y) * (a.x - c.x)) / denom;
  if(ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) return { x: a.x + ua * (b.x - a.x), y: a.y + ua * (b.y - a.y) };
  return null;
}

function onSegment(p, a, b) {
  const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
  if(l2 === 0) return false;
  let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
  if(t < 0 || t > 1) return false;
  return Math.hypot(a.x + t * (b.x - a.x) - p.x, a.y + t * (b.y - a.y) - p.y) <= 0.75;
}

function updateJunctions() {
  const old = new Map(state.junctions.map(j => [jKey(j), j]));
  const segs = [];
  for(const w of state.wires)
    for(let i = 0; i < w.points.length - 1; i++)
      if(w.points[i].x !== w.points[i+1].x || w.points[i].y !== w.points[i+1].y) segs.push({ a: w.points[i], b: w.points[i+1] });

  const cand = new Map();
  const addCand = (x, y) => { x = Math.round(x); y = Math.round(y); cand.set(x + ',' + y, { x, y }); };
  for(const w of state.wires) for(const p of w.points) addCand(p.x, p.y);
  for(let i = 0; i < segs.length; i++)
    for(let j = i + 1; j < segs.length; j++) {
      const p = segIntersect(segs[i].a, segs[i].b, segs[j].a, segs[j].b);
      if(p) addCand(p.x, p.y);
    }

  const pins = [];
  for(const c of state.components) for(let i = 0; i < C[c.type].pins.length; i++) pins.push(pinWorld(c, i));

  const result = [];
  for(const p of cand.values()) {
    let arms = 0;
    for(const s of segs) {
      if((Math.abs(s.a.x - p.x) <= 0.75 && Math.abs(s.a.y - p.y) <= 0.75) || (Math.abs(s.b.x - p.x) <= 0.75 && Math.abs(s.b.y - p.y) <= 0.75)) arms += 1;
      else if(onSegment(p, s.a, s.b)) arms += 2;
    }
    for(const q of pins) if(Math.abs(q.x - p.x) <= 2 && Math.abs(q.y - p.y) <= 2) arms += 1;
    if(arms >= 3) {
      const prev = old.get(jKey(p));
      result.push({ x: p.x, y: p.y, disconnected: !!(prev && prev.disconnected), removed: !!(prev && prev.removed) });
    }
  }
  state.junctions = result;
  renderJunctions();
}

function renderJunctions() {
  const layer = $('junctions-layer');
  layer.innerHTML = '';
  for(const j of state.junctions) {
    if(j.removed) continue;
    const g = el('g', { id: jId(j), transform: `translate(${j.x},${j.y})`, class: 'junction' }, layer);
    el('circle', { r: 8, fill: 'transparent', style: state.tool === 'select' ? 'cursor:pointer' : '' }, g);
    if(j.disconnected) el('path', { d: 'M-5,-3 Q0,5 5,-3', fill: 'none', stroke: '#dc2626', 'stroke-width': 1, 'pointer-events': 'none' }, g);
    else el('circle', { r: 3, fill: '#000', class: 'junction-dot', 'pointer-events': 'none' }, g);
    g.addEventListener('pointerdown', e => { if(state.tool === 'select') e.stopPropagation(); });
    g.addEventListener('click', e => {
      if(state.tool !== 'select') return;
      e.stopPropagation();
      showJunctionMenu(j, e);
    });
  }
}

function showJunctionMenu(j, e) {
  const k = jKey(j);
  showMenu(e, `
    <button onclick="toggleJunction('${k}')">${j.disconnected ? 'Als verbunden markieren' : 'Als nicht verbunden markieren'}</button>
    <hr>
    <button onclick="removeJunction('${k}')">Verbindungspunkt entfernen</button>`, 90);
}

function toggleJunction(k) {
  const j = state.junctions.find(x => jKey(x) === k);
  if(!j) return;
  j.disconnected = !j.disconnected;
  renderJunctions();
  pushHistory();
  closeMenu();
}
function removeJunction(k) {
  const j = state.junctions.find(x => jKey(x) === k);
  if(!j) return;
  j.removed = true;
  renderJunctions();
  pushHistory();
  closeMenu();
}
window.toggleJunction = toggleJunction;
window.removeJunction = removeJunction;

// ============================================================
// LÖSCHEN
// ============================================================

function deleteSelected() {
  const s = state.sel;
  if(!s) { showToast('Nichts ausgewählt'); return; }
  if(s.type === 'c') {
    state.components = state.components.filter(c => c.id !== s.id);
    $('c-' + s.id)?.remove();
  } else if(s.type === 'w') {
    state.wires = state.wires.filter(w => w.id !== s.id);
    $('w-' + s.id)?.remove();
  } else if(s.type === 'l') {
    state.labels = state.labels.filter(l => l.id !== s.id);
    $('l-' + s.id)?.remove();
  }
  state.sel = null;
  updateJunctions();
  applySelection();
  pushHistory();
  closeMenu();
}

function closeDialog() { $('modal-overlay').style.display = 'none'; }
window.closeDialog = closeDialog;
$('modal-overlay').addEventListener('pointerdown', e => { if(e.target === $('modal-overlay')) closeDialog(); });

function addText(x, y) {
  const label = { id: genId(), x, y, text: 'Text', size: 12 };
  state.labels.push(label);
  renderText(label);
  select('l', label.id);
  setTool('select');
  pushHistory();
  openTextDialog(label.id);
}

function textSVG(l, extra) {
  const lines = String(l.text).split('\n');
  const tspans = lines.map((t, i) => `<tspan x="0" dy="${i ? l.size * 1.2 : 0}">${escapeXml(latexToUnicode(t))}</tspan>`).join('');
  return `<text${extra || ''} x="0" y="0" font-size="${l.size}" font-family="Inter,sans-serif" fill="#000">${tspans}</text>`;
}

function renderText(label) {
  $('l-' + label.id)?.remove();
  const g = el('g', { id: 'l-' + label.id, transform: `translate(${label.x},${label.y})`, style: 'cursor:move' }, $('labels-layer'));
  g.innerHTML = textSVG(label);
  g.addEventListener('pointerdown', e => {
    if(state.tool !== 'select') return;
    e.stopPropagation();
    if(e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    select('l', label.id);
    startTextDrag(label.id, e);
  });
  g.addEventListener('dblclick', e => { if(state.tool === 'select') { e.stopPropagation(); openTextDialog(label.id); } });
  g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if(state.tool !== 'select') return;
    select('l', label.id);
    showMenu(e, `<button onclick="openTextDialog('${label.id}')">✏️ Bearbeiten</button><button onclick="deleteSelected()">🗑 Löschen</button>`, 80);
  });
  applySelection();
}

function openTextDialog(id) {
  const label = state.labels.find(l => l.id === id);
  if(!label) return;
  closeMenu();
  openDialog(`
    <h2>Text bearbeiten</h2>
    <label for="dlg-text">Text (mehrzeilig möglich, LaTeX-Symbole wie $\\Omega$ werden unterstützt)</label>
    <textarea id="dlg-text" rows="3">${escapeXml(label.text)}</textarea>
    <label for="dlg-size">Schriftgröße</label>
    <input type="number" id="dlg-size" value="${label.size}" min="6" max="72">
    <div class="btns">
      <button onclick="closeDialog()">Abbrechen</button>
      <button class="primary" onclick="saveText('${id}')">Speichern</button>
    </div>`, 'dlg-text');
  $('dlg-text').addEventListener('keydown', e => { if(e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); saveText(id); } });
}
window.openTextDialog = openTextDialog;

function saveText(id) {
  const label = state.labels.find(l => l.id === id);
  if(!label) return;
  label.text = $('dlg-text').value || 'Text';
  label.size = Math.min(72, Math.max(6, parseInt($('dlg-size').value) || 12));
  renderText(label);
  closeDialog();
  pushHistory();
}
window.saveText = saveText;

function startTextDrag(id, e) {
  const label = state.labels.find(l => l.id === id);
  if(!label) return;
  const pos = getSnappedPos(e);
  const ofs = { x: label.x - pos.x, y: label.y - pos.y };
  let moved = false;
  track(ev => {
    moved = true;
    const p = getSnappedPos(ev);
    label.x = p.x + ofs.x; label.y = p.y + ofs.y;
    $('l-' + id)?.setAttribute('transform', `translate(${label.x},${label.y})`);
  }, () => { if(moved) pushHistory(); });
}

// ============================================================
// EXPORT-BEREICH
// ============================================================

function contentBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const ext = (x1, y1, x2, y2) => { minX = Math.min(minX, x1); minY = Math.min(minY, y1); maxX = Math.max(maxX, x2); maxY = Math.max(maxY, y2); };
  for(const c of state.components) {
    const d = C[c.type]; if(!d) continue;
    const r = Math.max(d.w, d.h) / 2 + 4;
    ext(c.x - r, c.y - r, c.x + r, c.y + r);
    const lo = c.labelOff || { x: 0, y: 32 };
    const w = Math.max(String(c.label).length, String(c.value).length) * 3.5 + 4;
    ext(c.x + lo.x - w, c.y + lo.y, c.x + lo.x + w, c.y + lo.y + (c.value ? 28 : 14));
  }
  for(const w of state.wires) for(const p of w.points) ext(p.x - 4, p.y - 4, p.x + 4, p.y + 4);
  for(const l of state.labels) {
    const lines = String(l.text).split('\n');
    const longest = Math.max(...lines.map(t => t.length));
    ext(l.x - 2, l.y - l.size, l.x + longest * l.size * 0.6 + 4, l.y + (lines.length - 1) * l.size * 1.2 + 4);
  }
  if(!isFinite(minX)) return { x: 0, y: 0, w: 200, h: 200 };
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

function getBounds() {
  if(state.selRect) {
    const pad = 4;
    return { x: state.selRect.x - pad, y: state.selRect.y - pad, w: state.selRect.w + pad * 2, h: state.selRect.h + pad * 2 };
  }
  const b = contentBounds(), pad = 16;
  return { x: b.x - pad, y: b.y - pad, w: b.w + pad * 2, h: b.h + pad * 2 + 14 };
}

function clearArea() {
  state.selRect = null;
  $('selection-rect').style.display = 'none';
  showToast('Bereichsauswahl aufgehoben');
}
window.clearArea = clearArea;

// ============================================================
// EXPORT SVG
// ============================================================

const SIGNATURE = 'Vectronix by Tobias Schmidbauer';

function exportSVG() {
  const b = getBounds();
  const r = v => Math.round(v * 100) / 100;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${r(b.w)}" height="${r(b.h)}" viewBox="${r(b.x)} ${r(b.y)} ${r(b.w)} ${r(b.h)}" font-family="Inter,Arial,sans-serif">\n`;
  svg += `<clipPath id="crop"><rect x="${r(b.x)}" y="${r(b.y)}" width="${r(b.w)}" height="${r(b.h)}"/></clipPath><g clip-path="url(#crop)">\n`;

  for(const c of state.components) {
    if(!C[c.type]) continue;
    const rotAttr = c.angle ? ` transform="rotate(${c.angle})"` : '';
    svg += `<g transform="translate(${c.x},${c.y})"><g${rotAttr}>${compBodySVG(c)}</g>${compLabelSVG(c).replace(' style="cursor:move"', '')}</g>\n`;
  }
  for(const w of state.wires) {
    const pts = w.points;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
    svg += `<path d="${d}" fill="none" stroke="#000" stroke-width="1" stroke-linejoin="round"/>\n`;
  }
  for(const j of state.junctions) {
    if(j.removed) continue;
    if(j.disconnected) svg += `<path d="M ${j.x - 5} ${j.y - 3} Q ${j.x} ${j.y + 5} ${j.x + 5} ${j.y - 3}" fill="none" stroke="#dc2626" stroke-width="1"/>\n`;
    else svg += `<circle cx="${j.x}" cy="${j.y}" r="3" fill="#000"/>\n`;
  }
  for(const l of state.labels) svg += `<g transform="translate(${l.x},${l.y})">${textSVG(l)}</g>\n`;

  svg += `<text x="${r(b.x + 6)}" y="${r(b.y + b.h - 6)}" font-family="'Old Standard TT','Times New Roman',Georgia,serif" font-style="italic" font-size="10" fill="#000">${escapeXml(SIGNATURE)}</text>\n`;
  svg += '</g>\n</svg>\n';
  download(svg, 'schaltplan.svg', 'image/svg+xml');
  showToast('SVG exportiert (' + Math.round(b.w) + '×' + Math.round(b.h) + ' px)');
}

// ============================================================
// EXPORT LaTeX (circuitikz)
// ============================================================

function texText(s) {
  s = String(s);
  if(s.includes('$')) return s;
  return s.replace(/[\\&%#_{}~^]/g, m => ({ '\\':'\\textbackslash{}', '~':'\\textasciitilde{}', '^':'\\textasciicircum{}' }[m] || '\\' + m))
          .replace(/Ω/g, '$\\Omega$').replace(/[µμ]/g, '$\\mu$');
}

const TIKZ_BIPOLE = {
  resistor:'R', capacitor:'C', polarized_capacitor:'eC', inductor:'L', diode:'D', led:'leD',
  battery:'battery1', dc_source:'V', ac_source:'sV', lamp:'lamp', fuse:'fuse', switch:'spst',
  meter:'voltmeter', ammeter:'ammeter'
};

function exportTikZ() {
  const S = 32; // 32 Einheiten der Zeichenfläche = 1 TikZ-Einheit
  const f = v => +(v / S).toFixed(3);
  const P = p => `(${f(p.x)},${f(-p.y)})`;
  const b = getBounds();
  // Objekte, die den Bereich berühren; der Rest wird per \clip abgeschnitten
  const hits = (x1, y1, x2, y2) => x2 >= b.x && x1 <= b.x + b.w && y2 >= b.y && y1 <= b.y + b.h;
  const inside = (x, y) => hits(x, y, x, y);

  let t = `% Vectronix – Schaltplan (DIN EN 60617)
% Benötigt das Paket circuitikz. 32 Einheiten der Zeichenfläche = 1 TikZ-Einheit.
\\documentclass[border=2mm]{standalone}
\\usepackage[european]{circuitikz}
\\ctikzset{logic ports=european}

\\begin{document}
\\begin{circuitikz}[every node/.style={font=\\small}]
\\useasboundingbox ${P({ x: b.x, y: b.y })} rectangle ${P({ x: b.x + b.w, y: b.y + b.h })};
\\begin{scope}
\\clip ${P({ x: b.x, y: b.y })} rectangle ${P({ x: b.x + b.w, y: b.y + b.h })};
`;

  state.components.forEach((c, n) => {
    const def = C[c.type];
    if(!def) return;
    const r = Math.max(def.w, def.h) / 2 + 4;
    if(!hits(c.x - r, c.y - r, c.x + r, c.y + r)) return;
    const name = 'c' + n;
    const pw = i => P(pinWorld(c, i));
    const lbl = texText(latexToTexKeep(c.label));
    const val = c.value ? texText(c.value) : '';
    const opts = `l={${lbl}}` + (val ? `, a={${val}}` : '');
    const rotOpt = c.angle ? `, rotate=${-c.angle}` : '';
    const center = P(c);
    const lo = c.labelOff || { x: 0, y: 32 };
    const labelNode = `\\node[align=center] at ${P({ x: c.x + lo.x, y: c.y + lo.y + 8 })} {${lbl}${val ? `\\\\${val}` : ''}};`;
    t += `% ${def.name} ${c.label}\n`;

    if(TIKZ_BIPOLE[c.type]) {
      t += `\\draw ${pw(0)} to[${TIKZ_BIPOLE[c.type]}, ${opts}] ${pw(1)};\n`;
    } else switch(c.type) {
      case 'potentiometer':
        t += `\\draw ${pw(0)} to[pR, ${opts}, name=${name}] ${pw(1)};\n\\draw (${name}.wiper) -- ${pw(2)};\n`; break;
      case 'gnd':
        t += `\\node[ground${rotOpt}] at ${pw(0)} {};\n`; break;
      case 'motor':
        t += `\\node[draw, circle, inner sep=2pt, minimum size=1.5cm] (${name}) at ${center} {M};\n\\draw ${pw(0)} -- (${name}) ${pw(1)} -- (${name});\n${labelNode}\n`; break;
      case 'transformer':
      case 'transformer_air':
        t += `\\node[${c.type === 'transformer' ? 'transformer core' : 'transformer'}${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.A1) -- ${pw(0)}; \\draw (${name}.A2) -- ${pw(1)}; \\draw (${name}.B1) -- ${pw(2)}; \\draw (${name}.B2) -- ${pw(3)};\n${labelNode}\n`; break;
      case 'opamp':
        t += `\\node[op amp${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.+) -- ${pw(0)}; \\draw (${name}.-) -- ${pw(1)}; \\draw (${name}.out) -- ${pw(2)};\n${labelNode}\n`; break;
      case 'and_gate':
      case 'or_gate':
        t += `\\node[${c.type === 'and_gate' ? 'and' : 'or'} port${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.in 1) -- ${pw(0)}; \\draw (${name}.in 2) -- ${pw(1)}; \\draw (${name}.out) -- ${pw(2)};\n${labelNode}\n`; break;
      case 'not_gate':
        t += `\\node[not port${rotOpt}] (${name}) at ${center} {};\n`;
        t += `\\draw (${name}.in 1) -- ${pw(0)}; \\draw (${name}.out) -- ${pw(1)};\n${labelNode}\n`; break;
    }
  });

  t += '\n% Leitungen\n';
  for(const w of state.wires) {
    const xs = w.points.map(p => p.x), ys = w.points.map(p => p.y);
    if(!hits(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys))) continue;
    t += `\\draw ${w.points.map(P).join(' -- ')};\n`;
  }

  t += '\n% Verbindungspunkte\n';
  for(const j of state.junctions) {
    if(j.removed || j.disconnected || !inside(j.x, j.y)) continue;
    t += `\\node[circ] at ${P(j)} {};\n`;
  }

  if(state.labels.some(l => inside(l.x, l.y))) t += '\n% Texte\n';
  for(const l of state.labels) {
    if(!inside(l.x, l.y)) continue;
    t += `\\node[anchor=south west, align=left] at ${P(l)} {${String(l.text).split('\n').map(texText).join('\\\\')}};\n`;
  }

  t += `\\end{scope}\n`;
  t += `\\node[anchor=south west, inner sep=2pt, font=\\rmfamily\\itshape\\footnotesize] at ${P({ x: b.x, y: b.y + b.h })} {${SIGNATURE}};\n`;
  t += `\\end{circuitikz}\n\\end{document}\n`;
  showTikZDialog(t);
}

let tikzCode = '';

function showTikZDialog(code) {
  tikzCode = code;
  openDialog(`
    <h2>LaTeX-Code (circuitikz)</h2>
    <div class="hint" style="margin:0 0 8px">${state.selRect ? 'Exportiert wird der markierte Bereich.' : 'Exportiert wird der gesamte Schaltplan.'} Benötigt das Paket <code>circuitikz</code>.</div>
    <textarea id="tikz-out" readonly spellcheck="false" style="width:min(760px,80vw);height:min(420px,50vh);font-size:12px;white-space:pre;overflow:auto"></textarea>
    <div class="btns">
      <button onclick="downloadTikZ()">Als .tex speichern</button>
      <button onclick="copyTikZ()" class="primary" id="tikz-copy">📋 Code kopieren</button>
      <button onclick="closeDialog()">Schließen</button>
    </div>`);
  const ta = $('tikz-out');
  ta.value = code;
  ta.focus(); ta.select();
}

function copyTikZ() {
  const ta = $('tikz-out');
  const done = () => { $('tikz-copy').textContent = '✔ Kopiert'; showToast('LaTeX-Code kopiert'); };
  const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy') ? done() : showToast('Bitte mit Strg+C kopieren'); } catch(e) { showToast('Bitte mit Strg+C kopieren'); } };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(tikzCode).then(done, fallback);
  else fallback();
}

function downloadTikZ() { download(tikzCode, 'schaltplan.tex', 'text/plain'); }

// Beschriftungen wie "R_1" bleiben als Mathe-Text erhalten
function latexToTexKeep(s) { return /^[A-Za-z]+_\{?\w+\}?$/.test(s) ? '$' + s + '$' : s; }

// ============================================================
// SPEICHERN / LADEN
// ============================================================

function projectData() {
  return {
    version: 3,
    components: state.components,
    wires: state.wires.map(w => ({ id: w.id, points: w.points })),
    labels: state.labels,
    junctions: state.junctions,
    counter: state.counter,
  };
}

function saveJSON() {
  download(JSON.stringify(projectData(), null, 2), 'schaltplan.vectronix', 'application/json');
  showToast('Projekt gespeichert');
}

const num = v => typeof v === 'number' && isFinite(v);

// Setzt den kompletten Zustand aus Daten (Laden, Undo/Redo, Autosave)
function loadData(data) {
  clearAll();
  for(const c of (data.components || [])) {
    if(!c || !C[c.type] || !num(c.x) || !num(c.y)) continue;
    const comp = newComp(c.type, c.x, c.y, {
      id: c.id || genId(), label: String(c.label ?? ''), value: String(c.value ?? ''),
      angle: num(c.angle) ? c.angle : 0, showPolarity: !!c.showPolarity,
      labelOff: c.labelOff && num(c.labelOff.x) && num(c.labelOff.y) ? { x: c.labelOff.x, y: c.labelOff.y } : { x: 0, y: 32 },
    });
    if(!comp.label) comp.label = getNextId(C[comp.type].prefix);
    state.components.push(comp);
  }
  for(const w of (data.wires || [])) {
    if(!w || !Array.isArray(w.points) || w.points.length < 2) continue;
    if(!w.points.every(p => p && num(p.x) && num(p.y))) continue;
    state.wires.push({ id: w.id || genId(), points: w.points.map(p => ({ x: p.x, y: p.y })) });
  }
  for(const l of (data.labels || [])) {
    if(!l || !num(l.x) || !num(l.y)) continue;
    state.labels.push({ id: l.id || genId(), x: l.x, y: l.y, text: String(l.text ?? ''), size: num(l.size) ? l.size : 12 });
  }
  state.junctions = (data.junctions || []).filter(j => j && num(j.x) && num(j.y)).map(j => ({ x: Math.round(j.x), y: Math.round(j.y), disconnected: !!j.disconnected, removed: !!j.removed }));

  if(data.counter && typeof data.counter === 'object') state.counter = { ...data.counter };
  for(const c of state.components) {
    const m = /^([A-Z]+)(\d+)$/.exec(c.label);
    if(m && (state.counter[m[1]] || 0) < +m[2]) state.counter[m[1]] = +m[2];
  }
  state.components.forEach(renderComp);
  state.wires.forEach(renderWire);
  state.labels.forEach(renderText);
  updateJunctions();
  clearSelection();
}

function loadJSON(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object') throw new Error('Keine gültige Projektdatei');
      loadData(data);
      zoomFit();
      pushHistory();
      showToast('Projekt geladen (' + state.components.length + ' Bauteile, ' + state.wires.length + ' Leitungen)');
    } catch(err) {
      showToast('Fehler beim Laden: ' + err.message);
    }
  };
  reader.onerror = () => showToast('Datei konnte nicht gelesen werden');
  reader.readAsText(file);
}

function clearAll() {
  for(const id of ['components-layer', 'wires-layer', 'junctions-layer', 'labels-layer', 'temp-layer']) $(id).innerHTML = '';
  state.components = [];
  state.wires = [];
  state.labels = [];
  state.junctions = [];
  state.sel = null;
  cancelTransient();
}

function freshCounter() {
  return { R:0, C:0, L:0, D:0, Q:0, T:0, S:0, K:0, M:0, G:0, V:0, F:0, N:0, IC:0, X:0, P:0, U:0, Y:0, B:0, H:0, A:0, E:0 };
}

function newProject() {
  if(state.components.length || state.wires.length || state.labels.length) {
    if(!confirm('Wirklich neu beginnen? Ungespeicherte Änderungen gehen verloren.')) return;
  }
  clearAll();
  state.counter = freshCounter();
  setTool('select');
  pushHistory();
  showToast('Neues Projekt gestartet');
}

// ============================================================
// VERLAUF (Undo / Redo) + AUTOSAVE
// ============================================================

const AUTOSAVE_KEY = 'vectronix-autosave-v1';
let autosaveTimer;

function pushHistory() {
  state.history = state.history.slice(0, state.historyIdx + 1);
  state.history.push(JSON.stringify(projectData()));
  if(state.history.length > state.maxHistory) state.history.shift();
  state.historyIdx = state.history.length - 1;
  updateUndoButtons();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 400);
}

function autosave() {
  try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(projectData())); } catch(e) { /* z. B. privater Modus */ }
}

function updateUndoButtons() {
  $('btn-undo').disabled = state.historyIdx <= 0;
  $('btn-redo').disabled = state.historyIdx >= state.history.length - 1;
}

function restoreHistory() {
  const keep = state.counter;
  loadData(JSON.parse(state.history[state.historyIdx]));
  for(const [k, v] of Object.entries(keep)) if((state.counter[k] || 0) < v) state.counter[k] = v;
  updateUndoButtons();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosave, 400);
}

function undo() {
  if(state.historyIdx <= 0) return;
  state.historyIdx--;
  restoreHistory();
}

function redo() {
  if(state.historyIdx >= state.history.length - 1) return;
  state.historyIdx++;
  restoreHistory();
}

// ============================================================
// DOWNLOAD / TOAST
// ============================================================

function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

let toastTimeout;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2400);
}

// ============================================================
// ZEICHENFLÄCHE: EREIGNISSE
// ============================================================

canvas.addEventListener('pointerdown', e => {
  if(e.button === 1) { e.preventDefault(); startPan(e); return; }
  if(e.button !== 0) return;
  const tool = state.tool;

  if(tool === 'place') { placeAt(e); return; }

  if(tool === 'wire') {
    const pt = getWirePoint(e);
    if(!state.wireStart) {
      startWire(pt);
      const sx = e.clientX, sy = e.clientY;
      // Ziehen (Drücken-Ziehen-Loslassen) funktioniert ebenfalls, z. B. auf Touch-Geräten
      track(null, ev => {
        if(state.tool === 'wire' && state.wireStart && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 12)
          finishWire(getWirePoint(ev), ev.shiftKey);
      });
    } else finishWire(pt, e.shiftKey);
    return;
  }

  if(tool === 'text') { const p = getSnappedPos(e); addText(p.x, p.y); return; }

  if(tool === 'rect') {
    const pos = getSnappedPos(e);
    state.selStart = { x: pos.x, y: pos.y };
    const rect = $('selection-rect');
    rect.setAttribute('x', pos.x); rect.setAttribute('y', pos.y);
    rect.setAttribute('width', 0); rect.setAttribute('height', 0);
    rect.style.display = 'block';
    track(ev => {
      const p = getSnappedPos(ev), s = state.selStart;
      if(!s) return;
      rect.setAttribute('x', Math.min(s.x, p.x)); rect.setAttribute('y', Math.min(s.y, p.y));
      rect.setAttribute('width', Math.abs(p.x - s.x)); rect.setAttribute('height', Math.abs(p.y - s.y));
    }, ev => {
      const s = state.selStart;
      if(!s) return;
      const p = getSnappedPos(ev);
      const w = Math.abs(p.x - s.x), h = Math.abs(p.y - s.y);
      state.selStart = null;
      if(w > 8 && h > 8) {
        state.selRect = { x: Math.min(s.x, p.x), y: Math.min(s.y, p.y), w, h };
        showToast(`Bereich ${Math.round(w)}×${Math.round(h)} gesetzt – SVG/TikZ exportiert nur diesen Ausschnitt`);
      } else {
        rect.style.display = state.selRect ? 'block' : 'none';
        if(state.selRect) { rect.setAttribute('x', state.selRect.x); rect.setAttribute('y', state.selRect.y); rect.setAttribute('width', state.selRect.w); rect.setAttribute('height', state.selRect.h); }
      }
      setTool('select');
    });
    return;
  }

  if(tool === 'select') {
    clearSelection();
    startPan(e);
  }
});

canvas.addEventListener('pointermove', e => {
  if(e.pointerType === 'touch' && e.buttons === 0) return;
  const pos = getSnappedPos(e);
  $('cursor-pos').textContent = `X: ${pos.x}  Y: ${pos.y}`;
  if(state.tool === 'place') movePreview(e);
  else if(state.tool === 'wire') {
    const pt = getWirePoint(e);
    if(state.wireStart) updateWire(pt, e.shiftKey);
    else showSnapIndicator(pt);
  }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if(state.tool !== 'select') setTool('select');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

// ============================================================
// TASTATUR
// ============================================================

function typing(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    closeMenu(); closeDialog();
    if(state.tool !== 'select') setTool('select'); else clearSelection();
    return;
  }
  if(typing(e) || $('modal-overlay').style.display !== 'none') return;
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();

  if(mod) {
    if(k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(k === 'y') { e.preventDefault(); redo(); }
    else if(k === 'd') { e.preventDefault(); duplicateSelected(); }
    else if(k === 's') { e.preventDefault(); saveJSON(); }
    else if(k === 'o') { e.preventDefault(); $('load-input').click(); }
    return;
  }
  if(e.altKey) return;

  if(e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if(e.shiftKey && k === 'r') setTool('rect');
  else if(k === 'v') setTool('select');
  else if(k === 'w') setTool('wire');
  else if(k === 't') { e.preventDefault(); setTool('text'); }
  else if(k === 'r') rotateSelected();
  else if(k === 'f') zoomFit();
  else if(e.key === '+' || e.key === '=') zoomIn();
  else if(e.key === '-') zoomOut();
  else if(e.key === '0') zoomReset();
  else if(e.key === '?') showHelp();
});

// ============================================================
// START
// ============================================================

function init() {
  initPalette();
  toggleGrid();
  resetView();
  let restored = false;
  try {
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if(saved) {
      const data = JSON.parse(saved);
      if(data && ((data.components || []).length || (data.wires || []).length || (data.labels || []).length)) {
        loadData(data);
        zoomFit();
        restored = true;
      }
    }
  } catch(e) { /* defekter Autosave wird ignoriert */ }
  pushHistory();
  showToast(restored ? 'Letzte Sitzung wiederhergestellt' : 'Vectronix bereit – Bauteil aus der Palette auf die Fläche ziehen');
}

window.addEventListener('load', init);
</script>
